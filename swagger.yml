      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Subscription type ID
          example: 3
      responses:
        '200':
          description: List of subscriptions for this type
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 15
                  subscriptions:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Subscription'
                        - type: object
                          properties:
                            member:
                              type: object
                              properties:
                                user:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    fullName:
                                      type: string
                                    email:
                                      type: string
