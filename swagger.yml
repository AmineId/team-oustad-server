                  type: string
                  format: email
                  description: User's email address
                  example: "newuser@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number
                  example: "+33612345678"
                token:
                  type: string
                  description: 6-digit setup token
                  example: "123456"
                password:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
                  example: "mypassword123"
      responses:
        '200':
          description: Password created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe créé avec succès"
        '400':
          description: Invalid input or token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, token et mot de passe requis"
                      weak_password:
                        value: "Le mot de passe doit contenir au moins 6 caractères"
                      invalid_token:
                        value: "Token invalide ou expiré"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      summary: Get current user profile
      description: Returns the profile information of the currently authenticated user
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: User not found
        '500':
          description: Server error

  /users:
    post:
      summary: Create a new user
      description: |
        Create a new user with role-based permissions. Admins can create members, owners can create admins and members.
        
        **3 modes de création:**
        - **Avec email uniquement**: Email de bienvenue envoyé si pas de mot de passe fourni
        - **Avec phoneNumber uniquement**: Mot de passe OBLIGATOIRE, pas d'email envoyé
        - **Avec email ET phoneNumber**: Email de bienvenue envoyé si pas de mot de passe fourni, connexion possible avec les deux
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - role
                - gymId
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (email OU phoneNumber requis)
                  example: "member@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number (email OU phoneNumber requis)
                  example: "+33612345678"
                password:
                  type: string
                  minLength: 6
                  description: |
                    User's password (optionnel si email fourni - email de bienvenue sera envoyé)
                    OBLIGATOIRE si phoneNumber uniquement (pas d'email de bienvenue)
                  example: "password123"
                firstName:
                  type: string
                  description: User's first name
                  example: "John"
                lastName:
                  type: string
                  description: User's last name
                  example: "Doe"
                role:
                  type: string
                  enum: [manager, member]
                  description: User role (manager can create members, owner can create managers/members). `admin` accepté comme alias de `manager`.
                  example: "member"
                gymId:
                  type: integer
                  description: ID of the gym the user belongs to
                  example: 1
                sendSetupEmail:
                  type: boolean
                  description: Whether to send setup email when password is not provided (default true, ignored if phoneNumber only)
                  example: true
                  default: true
                permissions:
                  type: object
                  description: Permissions for owner role (only used when creating owners)
                  properties:
                    canManageAdmins:
                      type: boolean
                      default: true
                    canManageGyms:
                      type: boolean
                      default: true
                    canViewReports:
                      type: boolean
                      default: true
                    maxGymsAllowed:
                      type: integer
                      default: 5
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Utilisateur créé avec succès. Un email d'activation a été envoyé."
                  user:
                    $ref: '#/components/schemas/User'
                  setupEmailSent:
                    type: boolean
                    description: Whether a setup email was sent
                    example: true
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, firstName, lastName, role et gymId requis"
                      email_exists:
                        value: "Cet email est déjà utilisé"
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      forbidden:
                        value: "Forbidden"
                      no_permissions:
                        value: "Vous n'avez pas les permissions pour créer cet utilisateur"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List users
      description: Get a list of users filtered by the requester's permissions. Admins see users in their gym, owners see all users.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/qr:
    get:
      summary: Generate QR code for user
      description: Generate a QR code image for gym access. Members can access their own QR, admins can access QR codes of users in their gym, owners can access all QR codes.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
          example: 1
      responses:
        '200':
          description: QR code image (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      summary: Get user profile
      description: Get detailed information about a specific user. Owners can access all profiles, admins can access users in their gym, members can access their own profile.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
          example: 1
      responses:
        '200':
          description: User profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  fullName:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    enum: [owner, manager, coach, member]
                    example: "member"
                  displayId:
                    type: string
                    example: "MEMBER-a8f3d9e2b1c4f567"
                  gym:
                    $ref: '#/components/schemas/Gym'
                  activeSubscription:
                    $ref: '#/components/schemas/Subscription'
                  recentPayments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  permissions:
                    type: object
                    description: Only present for owner role
                    properties:
                      canManageAdmins:
                        type: boolean
                        description: "Déprécié : utiliser canManageManagers"
                      canManageManagers:
                        type: boolean
                        description: "Rôles V2 : alias de canManageAdmins (même valeur)"
                      canManageGyms:
                        type: boolean
                      canViewReports:
                        type: boolean
                      maxGymsAllowed:
                        type: integer
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user
      description: Update user information. Owners can update anyone, admins can update members in their gym, members can update their own profile.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID to update
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: New email address
                  example: "newemail@example.com"
                firstName:
                  type: string
                  description: New first name
                  example: "Jane"
                lastName:
                  type: string
                  description: New last name
                  example: "Doe"
                password:
                  type: string
                  minLength: 6
                  description: New password
                  example: "newpassword123"
                permissions:
                  type: object
                  description: Updated permissions for owner role
                  properties:
                    canManageAdmins:
                      type: boolean
                    canManageGyms:
                      type: boolean
                    canViewReports:
                      type: boolean
                    maxGymsAllowed:
                      type: integer
                phoneNumber:
                  type: string
                  description: "Chaîne non vide (espaces retirés) ; 400 invalid_phone ou phone_taken"
                gymId:
                  type: integer
                  description: "Salle d'un manager : owner avec canManageAdmins uniquement (403 gym_change_forbidden, 400 gym_not_found). Coach : PATCH /users/{id}/gyms"
      responses:
        '200':
          description: "Utilisateur mis à jour (objet brut, sans password ni profileImage : voir hasProfileImage)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: invalid_phone, phone_taken, gym_not_found
        '403':
          description: "Insufficient permissions, ou gym_change_forbidden"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete user
      description: Delete a user. Owners can delete anyone, admins can delete members in their gym, members cannot delete users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID to delete
