security:
  - bearerAuth: []

paths:
  /android/upload:
    post:
      tags:
        - Android OTA Updates
      summary: Upload APK with metadata
      description: Upload a new APK file with version metadata (requires authentication)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apk
                - version_code
                - version_name
              properties:
                apk:
                  type: string
                  format: binary
                  description: APK file to upload
                version_code:
                  type: integer
                  description: Version code (numeric, incremental)
                  example: 2
                version_name:
                  type: string
                  description: Version name (semantic versioning)
                  example: "1.0.1"
                changelog:
                  type: string
                  description: Changes in this version
                  example: "Bug fixes and performance improvements"
                min_supported_version:
                  type: integer
                  description: Minimum supported version code (for force update)
                  example: 1
                force_update:
                  type: boolean
                  description: Force users to update
                  example: false
                channel:
                  type: string
                  enum: [production, beta]
                  description: Deployment channel
                  example: production
                  default: production
      responses:
        '200':
          description: APK uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "APK uploaded successfully to production channel"
                  version:
                    type: object
                    properties:
                      version_code:
                        type: integer
                        example: 2
                      version_name:
                        type: string
                        example: "1.0.1"
                      download_url:
                        type: string
                        example: "https://app.team-oustad.com/android/app-release.apk"
                      changelog:
                        type: string
                        example: "Bug fixes and performance improvements"
                      min_supported_version:
                        type: integer
                        example: 1
                      force_update:
                        type: boolean
                        example: false
                      release_date:
                        type: string
                        format: date-time
                        example: "2025-11-15T12:30:00.000Z"
                      file_size:
                        type: integer
                        example: 25000000
                      checksum:
                        type: string
                        example: "abc123def456..."
                      channel:
                        type: string
                        example: "production"
                  checksums:
                    type: object
                    properties:
                      md5:
                        type: string
                        example: "d41d8cd98f00b204e9800998ecf8427e"
                      sha256:
                        type: string
                        example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        '400':
          description: Invalid input or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "version_code and version_name are required"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
                  message:
                    type: string

  /android/check-update:
    get:
      tags:
        - Android OTA Updates
      summary: Check for available updates
      description: Check if a new version is available for the Android app
      parameters:
        - in: query
          name: current_version
          required: true
          schema:
            type: integer
          description: Current installed version code
          example: 1
        - in: query
          name: channel
          schema:
            type: string
            enum: [production, beta]
          description: Update channel to check
          example: production
          default: production
        - in: query
          name: device_id
          schema:
            type: string
          description: Device identifier (optional, for analytics)
          example: "device-123"
      responses:
        '200':
          description: Update availability information
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_available:
                    type: boolean
                    example: true
                  current_version:
                    type: integer
                    example: 1
                  latest_version:
                    type: object
                    nullable: true
                    properties:
                      version_code:
                        type: integer
                        example: 2
                      version_name:
                        type: string
                        example: "1.0.1"
                      download_url:
                        type: string
                        example: "https://app.team-oustad.com/android/app-release.apk"
                      changelog:
                        type: string
                        example: "Bug fixes and improvements"
                      force_update:
                        type: boolean
                        example: false
                      file_size:
                        type: integer
                        example: 25000000
                      checksum:
                        type: string
                        example: "abc123..."
                      release_date:
                        type: string
                        format: date-time
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /android/download:
    get:
      tags:
        - Android OTA Updates
      summary: Download APK
      description: Download the latest APK file
      responses:
        '200':
          description: APK file
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: APK file not found
        '500':
          description: Server error

  /android/version:
    get:
      tags:
        - Android OTA Updates
      summary: Get version metadata
      description: Get metadata for the current published version
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_code:
                    type: integer
                  version_name:
                    type: string
                  download_url:
                    type: string
                  changelog:
                    type: string
                  min_supported_version:
                    type: integer
                  force_update:
                    type: boolean
                  release_date:
                    type: string
                    format: date-time
                  file_size:
                    type: integer
                  checksum:
                    type: string
        '500':
          description: Server error

  /android/checksum:
    get:
      tags:
        - Android OTA Updates
      summary: Calculate APK checksum
      description: Calculate and return checksums for the current APK
      responses:
        '200':
          description: Checksum information
          content:
            application/json:
              schema:
                type: object
                properties:
                  md5:
                    type: string
                  sha256:
                    type: string
                  file_size:
                    type: integer
        '404':
          description: APK file not found
        '500':
          description: Server error

  /android/beta/check-update:
    get:
      tags:
        - Android OTA Updates - Beta Channel
      summary: Check for beta updates
      description: Check if a new beta version is available
      parameters:
        - in: query
          name: current_version
          required: true
          schema:
            type: integer
          description: Current installed version code
          example: 1
        - in: query
          name: device_id
          schema:
            type: string
          description: Device identifier (optional)
      responses:
        '200':
          description: Beta update availability information
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /android/beta/download:
    get:
      tags:
        - Android OTA Updates - Beta Channel
      summary: Download beta APK
      description: Download the latest beta APK file
      responses:
        '200':
          description: Beta APK file
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: Beta APK file not found
        '500':
          description: Server error

  /android/beta/version:
    get:
      tags:
        - Android OTA Updates - Beta Channel
      summary: Get beta version metadata
      description: Get metadata for the current beta version
      responses:
        '200':
          description: Beta version metadata
        '500':
          description: Server error

  /android/beta/checksum:
    get:
      tags:
        - Android OTA Updates - Beta Channel
      summary: Calculate beta APK checksum
      description: Calculate and return checksums for the beta APK
      responses:
        '200':
          description: Beta checksum information
        '404':
          description: Beta APK file not found
        '500':
          description: Server error

  /android/update-version:
    post:
      tags:
        - Android OTA Updates
      summary: Publier les métadonnées de version (sans APK)
      description: >
        Publie les métadonnées de version sans uploader de fichier APK. Utilisé par la CI après
        une release Play Store pour mettre à jour les réponses de check-update sans générer/uploader un APK.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version_code
                - version_name
              properties:
                version_code:
                  type: integer
                  description: Code de version (numérique, incrémental, doit être > version actuelle)
                  example: 75
                version_name:
                  type: string
                  description: Nom de version (versionnage sémantique)
                  example: "1.0.0-beta.70"
                download_url:
                  type: string
                  description: URL du store ou de téléchargement
                  example: "https://play.google.com/store/apps/details?id=team.fitness.team_fitness_app"
                changelog:
                  type: string
                  description: Changements dans cette version
                  example: "Corrections de bugs et améliorations"
                force_update:
                  type: boolean
                  description: Forcer la mise à jour
                  example: false
                channel:
                  type: string
                  enum: [production, beta]
                  description: Canal de déploiement
                  default: production
                min_supported_version:
                  type: integer
                  description: Version minimale supportée. Si absent, conserve la valeur actuelle (ou 1 si aucune version publiée).
                  example: 70
      responses:
        '200':
          description: Métadonnées de version mises à jour avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Version metadata updated successfully for beta channel"
                  version:
                    type: object
                    properties:
                      version_code:
                        type: integer
                        example: 75
                      version_name:
                        type: string
                        example: "1.0.0-beta.70"
                      download_url:
                        type: string
                        example: "https://play.google.com/store/apps/details?id=team.fitness.team_fitness_app"
                      changelog:
                        type: string
                        example: "Corrections de bugs"
                      min_supported_version:
                        type: integer
                        example: 70
                      force_update:
                        type: boolean
                        example: false
                      release_date:
                        type: string
                        format: date-time
                        example: "2025-11-15T12:30:00.000Z"
        '400':
          description: Paramètres invalides
        '401':
          description: Non autorisé
        '409':
          description: Retour arrière de version refusé
        '500':
          description: Erreur serveur

  /android/config:
    get:
      tags:
        - Android OTA Updates
      summary: Get Android app configuration
      description: Returns app configuration including API URL, minimum supported version, and enabled features
      responses:
        '200':
          description: App configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiUrl:
                    type: string
                    example: "http://localhost:3000"
                  minVersion:
                    type: integer
                    example: 1
                  features:
                    type: object
                    properties:
                      offlineMode:
                        type: boolean
                        example: true
                      pushNotifications:
                        type: boolean
                        example: true

  /health:
    get:
      summary: Health check
      description: Check server and database connectivity
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  db:
                    type: string
                    example: "connected"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string

  /auth/check-phone:
    post:
      summary: Vérifier si un numéro de téléphone existe
      description: Vérifie si un numéro de téléphone est déjà enregistré et si un mot de passe est configuré. Utile avant la création d'un compte.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  example: "+33612345678"
                  description: "Numéro de téléphone à vérifier"
      responses:
        '200':
          description: Numéro vérifié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                    description: "Indique si le numéro existe déjà"
                  hasPassword:
                    type: boolean
                    example: true
                    description: "Indique si un mot de passe est configuré"
                  message:
                    type: string
                    example: "Ce numéro existe déjà avec un mot de passe configuré"
        '409':
          description: Le numéro existe déjà avec un mot de passe
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                  hasPassword:
                    type: boolean
                    example: true
                  hasEmail:
                    type: boolean
                    example: true
                    description: "Indique si l'utilisateur a un email configuré (pour la réinitialisation)"
                  error:
                    type: string
                    example: "Vous avez déjà un compte avec un mot de passe. Si vous l'avez oublié, cliquez sur \"Réinitialiser le mot de passe\""
        '400':
          description: Numéro de téléphone manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login
      description: Authenticate user with email or phone number and return JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: "Email de l'utilisateur (email OU phoneNumber requis)"
                phoneNumber:
                  type: string
                  example: "+33612345678"
                  description: "Numéro de téléphone (email OU phoneNumber requis)"
                password:
                  type: string
                  example: "password123"
                client:
                  type: string
                  enum: [app, kiosk]
                  default: app
                  description: |
                    `kiosk` pour la borne : réservé aux owners et managers. La session kiosk
                    a son propre emplacement : elle ne déconnecte pas l'app, et inversement
                    (une nouvelle connexion du même client invalide l'ancien token de ce client).
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: "Connexion kiosk refusée pour ce rôle (coach, member)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: kiosk_forbidden_role
                  message:
                    type: string
                    example: "Le kiosk est réservé aux owners et managers"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current user profile
      description: Get detailed profile information for the authenticated user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  fullName:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    enum: [owner, manager, coach, member]
                    example: "member"
                  type:
                    type: string
                    enum: [owner, manager, coach, member]
                    description: "Identique à `role`"
                  displayId:
                    type: string
                    example: "MEMBER-a8f3d9e2b1c4f567"
                  gymId:
                    type: integer
                  gym:
                    $ref: '#/components/schemas/Gym'
                  gyms:
                    type: array
                    description: "Owner : toutes les salles avec `stats` (`members`, `managers`, `coaches`, `admins` (déprécié), `owners`). Coach : ses salles `[{id, displayId, name}]`."
                    items:
                      type: object
                  activeSubscription:
                    $ref: '#/components/schemas/Subscription'
                  recentPayments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  permissions:
                    type: object
                    description: Only present for owner role
                    properties:
                      canManageAdmins:
                        type: boolean
                        description: "Déprécié : utiliser canManageManagers"
                      canManageManagers:
                        type: boolean
                        description: "Rôles V2 : alias de canManageAdmins (même valeur)"
                      canManageGyms:
                        type: boolean
                      canViewReports:
                        type: boolean
                      maxGymsAllowed:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/scan-qr:
    post:
      summary: Scan and validate QR code
      description: "Valide l'accès d'un membre (manager : sa salle ; owner : toutes). `qrData` = contenu brut du QR (JSON avec displayId, ou code brut) ; `qrCode` accepté en alias. Ne pointe pas : le kiosk n'autorise l'entrée que si `quota.canCheckIn`, puis appelle POST /check-in/scan."
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrData
              properties:
                qrData:
                  type: string
                  description: QR code data to validate
                  example: "{\"userId\":1,\"displayId\":\"MEMBER-a8f3d9e2b1c4f567\",\"fullName\":\"John Doe\",\"role\":\"member\",\"gymName\":\"Downtown Fitness\",\"accessType\":\"gym_access\",\"timestamp\":\"2024-01-01T10:00:00.000Z\"}"
      responses:
        '200':
          description: QR code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Accès autorisé - 7 séance(s) restante(s)"
                  member:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      fullName:
                        type: string
                        example: "John Doe"
                      email:
                        type: string
                        example: "john@example.com"
                      displayId:
                        type: string
                        example: "MEMBER-a8f3d9e2b1c4f567"
                      profileImageUrl:
                        type: string
                        nullable: true
                        example: "https://example.com/profile.jpg"
                      subscription:
                        type: object
                        description: "Active subscription details"
                  quota:
                    type: object
                    nullable: true
                    properties:
                      sessionQuota:
                        type: integer
                        nullable: true
                        example: 12
                        description: "Total sessions in subscription (null if unlimited)"
                      sessionsUsed:
                        type: integer
                        example: 5
                      sessionsRemaining:
                        type: integer
                        nullable: true
                        example: 7
                        description: "Remaining sessions (null if unlimited)"
                      isUnlimited:
                        type: boolean
                        example: false
                      percentageUsed:
                        type: integer
                        example: 42
                      canCheckIn:
                        type: boolean
                        example: true
                  lastCheckIn:
                    type: object
                    nullable: true
                    properties:
                      checkInTime:
                        type: string
                        format: date-time
                        example: "2025-12-31T10:30:00.000Z"
                      gymName:
                        type: string
                        example: "Team Fitness Downtown"
        '400':
          description: Invalid QR code or access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "QR code invalide ou accès refusé"
                  reason:
                    type: string
                    enum: [invalid_qr, expired_subscription, no_active_subscription, user_not_found]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Send a password reset code to the user's email address (requires email)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number (email must exist for reset)
                  example: "+33612345678"
      responses:
        '200':
          description: Reset code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Si cet email existe, un code de réinitialisation a été envoyé"
        '400':
          description: Email is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Reset user password using the reset token sent via email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number
                  example: "+33612345678"
                token:
                  type: string
                  description: 6-digit reset token
                  example: "123456"
                newPassword:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
                  example: "newpassword123"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe réinitialisé avec succès"
        '400':
          description: Invalid input or token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, token et nouveau mot de passe requis"
                      weak_password:
                        value: "Le mot de passe doit contenir au moins 6 caractères"
                      invalid_token:
                        value: "Token invalide ou expiré"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/send-setup-email:
    post:
      summary: Send account setup email
