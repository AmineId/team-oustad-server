    get:
      summary: Get all members of a specific gym
      description: Get a list of all members in a specific gym with their subscription status and recent payments. Owners can access any gym, admins can only access their own gym.
      tags: [Users, Gyms]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: gymId
          required: true
          schema:
            type: integer
          description: Gym ID
          example: 1
      responses:
        '200':
          description: List of members in the gym
          content:
            application/json:
              schema:
                type: object
                properties:
                  gym:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "Fitness Center A"
                      address:
                        type: string
                        example: "123 Main St"
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        email:
                          type: string
                          example: "member@example.com"
                        fullName:
                          type: string
                          example: "John Doe"
                        displayId:
                          type: string
                          example: "MEMBER-a8f3d9e2b1c4f567"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        activeSubscription:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                              example: 1
                            type:
                              type: string
                              example: "Premium"
                            status:
                              type: string
                              enum: [active, paused, cancelled, expired, pending]
                              example: "active"
                            startDate:
                              type: string
                              format: date-time
                              example: "2024-01-01T00:00:00.000Z"
                            endDate:
                              type: string
                              format: date-time
                              example: "2024-12-31T23:59:59.000Z"
                            lastPayment:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: integer
                                amount:
                                  type: number
                                status:
                                  type: string
                                paidAt:
                                  type: string
                                  format: date-time
                        recentPayments:
                          type: array
                          items:
                            $ref: '#/components/schemas/Payment'
                  count:
                    type: integer
                    description: Total number of members in the gym
                    example: 25
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Vous n'avez pas accès aux membres de cette salle"
