                  description: User's email address
                  example: "user@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number (email must exist for reset)
                  example: "+33612345678"
      responses:
        '200':
          description: Reset code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Si cet email existe, un code de réinitialisation a été envoyé"
        '400':
          description: Email is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Reset user password using the reset token sent via email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number
                  example: "+33612345678"
                token:
                  type: string
                  description: 6-digit reset token
                  example: "123456"
                newPassword:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
                  example: "newpassword123"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe réinitialisé avec succès"
        '400':
          description: Invalid input or token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, token et nouveau mot de passe requis"
                      weak_password:
                        value: "Le mot de passe doit contenir au moins 6 caractères"
                      invalid_token:
                        value: "Token invalide ou expiré"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

