  /sessions/{id}/members/{memberId}:
    delete:
      summary: Désinscrire un membre (Owner / Manager)
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Séance mise à jour (statut du membre `cancelled`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: member_not_in_session

  /sessions/{id}/check-in:
    post:
      summary: Pointer un membre à la séance (Coach de la séance / Manager / Owner)
      description: |
        Crée aussi l'entrée salle du jour (décompte du quota) si le membre n'a pas encore scanné aujourd'hui ;
        sinon `created: false` et rien n'est décompté. Re-pointer est idempotent.
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId:
                  type: integer
      responses:
        '200':
          description: Membre pointé
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: '#/components/schemas/SessionMember'
                  gymCheckIn:
                    type: object
                    properties:
                      id:
                        type: integer
                      created:
                        type: boolean
                      sessionsRemaining:
                        type: integer
                        nullable: true
        '403':
          description: Ni coach de la séance, ni staff de la salle
        '404':
          description: member_not_in_session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'
        '409':
          description: session_not_open, no_active_subscription, quota_exhausted, subscription_expired (rien n'est pointé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'

  /coaches/me/sessions:
    get:
      summary: Séances du coach connecté (Coach)
      tags: [Coaches, Sessions]
