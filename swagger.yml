  /subscriptions:
    post:
      summary: Create a new subscription
      description: Create a new annual subscription with flexible payment frequency. Admins can create subscriptions for members in their gym, owners can create for any member.
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - subscriptionTypeId
              properties:
                memberId:
                  type: integer
                  description: ID of the member
                  example: 5
                subscriptionTypeId:
                  type: integer
                  description: ID of the subscription type
                  example: 3
                startDate:
                  type: string
                  format: date-time
                  description: Subscription start date (defaults to now)
                  example: "2024-01-01T00:00:00.000Z"
                paymentFrequency:
                  type: integer
                  description: Number of payments per year (1=oneshot, 3=quarterly, 6=biannual, 12=monthly)
                  enum: [1, 3, 6, 12]
                  default: 12
                  example: 12
      responses:
        '201':
          description: Subscription created successfully with payments generated according to frequency
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Abonnement annuel créé avec succès (paiement mensuel)"
                  subscription:
                    $ref: '#/components/schemas/Subscription'
                  subscriptionType:
                    $ref: '#/components/schemas/SubscriptionType'
                  paymentsGenerated:
                    type: integer
                    example: 12
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        monthNumber:
                          type: integer
                        amount:
                          type: number
                        dueDate:
                          type: string
                          format: date-time
                        status:
                          type: string
        '400':
          description: Invalid input or subscription type not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "memberId et subscriptionTypeId sont requis"
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

