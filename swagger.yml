              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    post:
      summary: Create a new user
      description: |
        Create a new user with role-based permissions. Admins can create members, owners can create admins and members.
        
        **3 modes de création:**
        - **Avec email uniquement**: Email de bienvenue envoyé si pas de mot de passe fourni
        - **Avec phoneNumber uniquement**: Mot de passe OBLIGATOIRE, pas d'email envoyé
        - **Avec email ET phoneNumber**: Email de bienvenue envoyé si pas de mot de passe fourni, connexion possible avec les deux
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - role
                - gymId
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (email OU phoneNumber requis)
                  example: "member@example.com"
                phoneNumber:
                  type: string
                  description: User's phone number (email OU phoneNumber requis)
                  example: "+33612345678"
                password:
                  type: string
                  minLength: 6
                  description: |
                    User's password (optionnel si email fourni - email de bienvenue sera envoyé)
                    OBLIGATOIRE si phoneNumber uniquement (pas d'email de bienvenue)
                  example: "password123"
                fullName:
                  type: string
                  description: User's full name
                  example: "John Doe"
                role:
                  type: string
                  enum: [admin, member]
                  description: User role (admin can create members, owner can create admins/members)
                  example: "member"
                gymId:
                  type: integer
                  description: ID of the gym the user belongs to
                  example: 1
                sendSetupEmail:
                  type: boolean
                  description: Whether to send setup email when password is not provided (default true, ignored if phoneNumber only)
                  example: true
                  default: true
                permissions:
                  type: object
                  description: Permissions for owner role (only used when creating owners)
                  properties:
                    canManageAdmins:
                      type: boolean
                      default: true
                    canManageGyms:
                      type: boolean
                      default: true
                    canViewReports:
                      type: boolean
                      default: true
                    maxGymsAllowed:
                      type: integer
                      default: 5
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Utilisateur créé avec succès. Un email d'activation a été envoyé."
                  user:
                    $ref: '#/components/schemas/User'
                  setupEmailSent:
                    type: boolean
                    description: Whether a setup email was sent
                    example: true
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, fullName, role et gymId requis"
                      email_exists:
                        value: "Cet email est déjà utilisé"
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      forbidden:
                        value: "Forbidden"
                      no_permissions:
                        value: "Vous n'avez pas les permissions pour créer cet utilisateur"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List users
      description: Get a list of users filtered by the requester's permissions. Admins see users in their gym, owners see all users.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

