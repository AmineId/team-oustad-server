  /auth/check-phone:
    post:
      summary: Vérifier si un numéro de téléphone existe
      description: Vérifie si un numéro de téléphone est déjà enregistré et si un mot de passe est configuré. Utile avant la création d'un compte.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  example: "+33612345678"
                  description: "Numéro de téléphone à vérifier"
      responses:
        '200':
          description: Numéro vérifié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                    description: "Indique si le numéro existe déjà"
                  hasPassword:
                    type: boolean
                    example: true
                    description: "Indique si un mot de passe est configuré"
                  message:
                    type: string
                    example: "Ce numéro existe déjà avec un mot de passe configuré"
        '409':
          description: Le numéro existe déjà avec un mot de passe
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                  hasPassword:
                    type: boolean
                    example: true
                  hasEmail:
                    type: boolean
                    example: true
                    description: "Indique si l'utilisateur a un email configuré (pour la réinitialisation)"
                  error:
                    type: string
                    example: "Vous avez déjà un compte avec un mot de passe. Si vous l'avez oublié, cliquez sur \"Réinitialiser le mot de passe\""
        '400':
          description: Numéro de téléphone manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login
      description: Authenticate user with email or phone number and return JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: "Email de l'utilisateur (email OU phoneNumber requis)"
                phoneNumber:
                  type: string
                  example: "+33612345678"
                  description: "Numéro de téléphone (email OU phoneNumber requis)"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current user profile
      description: Get detailed profile information for the authenticated user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  fullName:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    enum: [owner, admin, member]
                    example: "member"
                  displayId:
                    type: string
                    example: "MEMBER-a8f3d9e2b1c4f567"
                  gym:
                    $ref: '#/components/schemas/Gym'
                  activeSubscription:
                    $ref: '#/components/schemas/Subscription'
                  recentPayments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  permissions:
