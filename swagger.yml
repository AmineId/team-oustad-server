  /users/create-owner:
    post:
      summary: Create a new owner (Owner only)
      description: Create a new owner user. Only existing owners can create new owners.
      tags: [Users, Owners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - gymId
              properties:
                email:
                  type: string
                  format: email
                  description: Owner's email address
                  example: "owner@example.com"
                password:
                  type: string
                  minLength: 6
                  description: Owner's password
                  example: "password123"
                firstName:
                  type: string
                  description: Owner's first name
                  example: "John"
                lastName:
                  type: string
                  description: Owner's last name
                  example: "Owner"
                gymId:
                  type: integer
                  description: ID of the gym the owner belongs to
                  example: 1
                permissions:
                  type: object
                  description: Owner permissions
                  properties:
                    canManageAdmins:
                      type: boolean
                      default: true
                    canManageGyms:
                      type: boolean
                      default: true
                    canViewReports:
                      type: boolean
                      default: true
                    maxGymsAllowed:
                      type: integer
                      default: 5
      responses:
        '201':
          description: Owner created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Propriétaire créé avec succès"
                  owner:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        format: email
                        example: "owner@example.com"
                      firstName:
                        type: string
                        example: "John"
                      lastName:
                        type: string
                        example: "Owner"
                      permissions:
                        type: object
                        properties:
                          canManageAdmins:
                            type: boolean
                          canManageGyms:
                            type: boolean
                          canViewReports:
                            type: boolean
                          maxGymsAllowed:
                            type: integer
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - not an owner
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/create-manager:
    post:
      summary: Create a new manager (Owner only)
      description: |
        Crée un manager (ex-admin) rattaché à une salle. Owner avec `canManageAdmins` uniquement.
        `POST /users/create-admin` reste disponible comme alias pendant la transition (même réponse).
      tags: [Users, Owners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - gymId
              properties:
                email:
                  type: string
                  format: email
                  description: Admin's email address
                  example: "admin@example.com"
                password:
                  type: string
                  minLength: 6
                  description: Admin's password
                  example: "password123"
                firstName:
                  type: string
                  description: Admin's first name
                  example: "Jane"
                lastName:
                  type: string
                  description: Admin's last name
                  example: "Admin"
                gymId:
                  type: integer
                  description: ID of the gym the admin belongs to
                  example: 1
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Manager créé avec succès"
                  setupEmailSent:
                    type: boolean
                  manager:
                    $ref: '#/components/schemas/CreatedManager'
                  admin:
                    $ref: '#/components/schemas/CreatedManager'
                    description: "Déprécié : identique à `manager`"
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - not an owner
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /users/create-admin:
    post:
