  /android/check-update:
    get:
      tags:
        - Android OTA Updates
      summary: Vérifier la disponibilité d'une mise à jour
      description: Vérifie si une nouvelle version de l'application Android est disponible en comparant avec la version actuelle
      parameters:
        - in: query
          name: current_version
          required: true
          schema:
            type: integer
            example: 1
          description: Version actuelle installée (version_code)
        - in: query
          name: device_id
          schema:
            type: string
            example: "device123abc"
          description: Identifiant unique de l'appareil (optionnel, pour analytics)
      responses:
        '200':
          description: Informations sur la mise à jour disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_available:
                    type: boolean
                    example: true
                  current_version:
                    type: integer
                    example: 1
                  latest_version:
                    type: object
                    nullable: true
                    properties:
                      version_code:
                        type: integer
                        example: 2
                      version_name:
                        type: string
                        example: "1.0.1"
                      download_url:
                        type: string
                        example: "https://app.team-oustam.com/android/app-release.apk"
                      changelog:
                        type: string
                        example: "Corrections de bugs et améliorations de performance"
                      force_update:
                        type: boolean
                        example: false
                      file_size:
                        type: integer
                        example: 25000000
                      checksum:
                        type: string
                        example: "abc123def456789..."
                      release_date:
                        type: string
                        format: date-time
                        example: "2025-11-15T12:00:00Z"
        '400':
          description: Paramètre current_version manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

