openapi: 3.0.0
info:
  title: Team Fitness API
  version: 1.0.0
  description: |
    API pour la gestion des salles de sport Team Fitness

    ## Rôles V2
    Rôles : `owner` (toutes les salles), `manager` (une salle, ex-`admin`), `coach` (une ou plusieurs
    salles via CoachGym, créé par l'owner), `member`.
    - `admin` reste accepté **en entrée** comme alias de `manager` (body `role`, anciens JWT),
      mais le serveur renvoie toujours `manager`.
    - Le manager reçoit un **403** sur la vitrine et les promos : `/showcase/*`, écriture `/banners`,
      champs vitrine de `PUT /gyms/{id}` (`isPublished`, `slug`, `description` → `showcase_forbidden`),
      `/gyms/{id}/photos*`, `/gyms/{id}/showcase`, `PUT|DELETE /gyms/{id}/image`, et les horaires
      d'ouverture (`POST /gyms/{id}/opening-hours`).
    - Store (`/store/*` staff) : le manager est limité à sa salle (403 sinon) ; l'owner gère toutes les salles.
    - Coach : **refusé par défaut** (403 `coach_forbidden`) sauf sur les routes qui lui sont ouvertes :
      son profil (`/auth/me`, `/users/me`, `/users/{sonId}`…), `/coaches/me/*`, lecture de ses salles
      (`GET /gyms`, `/gyms/{id}`, horaires, image). Pour un coach, se baser sur `gyms` et non sur `gymId`
      (salle principale).
    - Programmes : l'owner crée des modèles (`/programs`), affectés aux membres
      (`POST /programs/{id}/assignments`) par l'owner ou le coach (ses membres) ; le manager les consulte en lecture seule.
      Les routes `/plannings` en lecture (`/member/{id}`, `/next-day/{id}`, `GET /plannings`) gardent leur
      forme et sont alimentées par les affectations (`planning.id` = id de l'affectation) ; les écritures
      `/plannings` renvoient **410** `plannings_deprecated`.
    - Séances (`/sessions`) : plage de travail d'un coach avec un ou plusieurs membres, gérée par l'owner
      ou le manager de la salle (chevauchement coach → 409, récurrence hebdomadaire ≤ 26, horaires
      d'ouverture en heure du Maroc). Le coach lit et pointe ses séances.
    - Check-ins : toutes les routes `/check-in/*` appliquent la portée de salle (voir `x-roles-v2`) ;
      `GET /check-in/today` sert au coach (ses salles), au manager (sa salle) et à l'owner.
    - Incidents (`/incidents`) : signalés par le manager (sa salle, app ou kiosk) ou le coach (ses salles,
      app uniquement) ; `source` est déduite du token. L'owner et le créateur répondent dans le fil ;
      seul l'owner change le statut. FCM `data: { type: "incident", incidentId, action }`.
    - Kiosk : `POST /auth/login` avec `client: "kiosk"`, réservé aux owners et managers
      (403 `kiosk_forbidden_role`). La session kiosk est distincte de la session app.
  contact:
    name: Team Fitness Support
    email: support@teamfitness.com

servers:
  - url: https://api-pprod.team-oustad.com
    description: Serveur de pré-production
  - url: http://localhost:3001
    description: Serveur de développement local
  - url: https://api.teamfitness.com
    description: Serveur de production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        phoneNumber:
          type: string
          example: "+33612345678"
          description: "Numéro de téléphone de l'utilisateur"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        role:
          type: string
          enum: [member, coach, manager, owner]
          description: "`admin` est accepté en entrée comme alias de `manager`, jamais renvoyé"
          example: "member"
        type:
          type: string
          enum: [member, coach, manager, owner]
          description: "Identique à `role` (compatibilité)"
        client:
          type: string
          enum: [app, kiosk]
          description: "Renvoyé au login : client pour lequel le token a été émis"
        gyms:
          type: array
          description: "Coach uniquement : ses salles (CoachGym)"
          items:
            $ref: '#/components/schemas/GymRef'
        displayId:
          type: string
          example: "MEMBER-a8f3d9e2b1c4f567"
        gymId:
          type: integer
          example: 1
        gym:
          $ref: '#/components/schemas/Gym'
        hasProfileImage:
          type: boolean
          description: "Présence d'une photo de profil (GET /users/{id}/profile-image). Le binaire n'est jamais inclus dans le JSON."
      required:
        - id
        - firstName
        - lastName
        - role
        - displayId
        - gymId

    Gym:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Downtown Fitness"
        address:
          type: string
          example: "123 Main St"
        phone:
          type: string
          example: "+1234567890"
        isPublished:
          type: boolean
          default: false
          example: false
        slug:
          type: string
          nullable: true
          example: "downtown-fitness-1"
        description:
          type: string
          nullable: true
          maxLength: 5000
          description: Texte de présentation (markdown) affiché sur la fiche vitrine
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHour'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - address

    ShowcaseSection:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          maxLength: 40
          example: "s1k9x"
        type:
          type: string
          maxLength: 40
          description: |
            Contenu : markdown, feature, testimonials, marquee, categories, cta.
            Intégrées (sans data) : gyms, promos (accueil) ; gymAbout, gymPromos,
            gymInfo, gymHours, gymTeam, gymSubscriptions (salle). Le serveur
            stocke tout type ; l'app ignore ceux qu'elle ne connaît pas.
          example: "markdown"
        visible:
          type: boolean
          default: true
        data:
          type: object
          additionalProperties: true
          description: Champs propres au type (chaînes ≤ 5000, tableaux ≤ 20). `url` en http(s) uniquement.
          example: { title: "Tarifs", body: "**30 €** / mois" }

    ShowcasePage:
      type: object
      description: Page CMS du site vitrine ; `{}` tant que rien n'a été enregistré.
      properties:
        hero:
          type: object
          description: Page d'accueil uniquement
          properties:
            eyebrow:
              type: string
              maxLength: 200
            tagline:
              type: string
              maxLength: 200
        sections:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/ShowcaseSection'

    GymPhoto:
      type: object
      properties:
        id:
          type: integer
          example: 5
        position:
          type: integer
          example: 0
        isCover:
          type: boolean
          example: true

    OpeningHour:
      type: object
      properties:
        id:
          type: integer
          example: 1
        gymId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche, 1 = lundi, ..., 6 = samedi"
          example: 1
        openTime:
          type: string
          format: time
          example: "09:00"
        closeTime:
          type: string
          format: time
          example: "18:00"
        isClosed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - gymId
        - dayOfWeek
        - openTime
        - closeTime
        - isClosed

    SubscriptionType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Premium"
        description:
          type: string
          example: "Formule complète avec coaching personnel"
        monthlyPrice:
          type: number
          format: float
          example: 79.99
        features:
          type: array
          items:
            type: string
          example: ["Tout Standard +", "2 séances coach/mois", "Planning personnalisé"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - monthlyPrice
        - isActive

    Subscription:
      type: object
      properties:
        id:
          type: integer
          example: 1
        memberId:
          type: integer
          example: 1
        subscriptionTypeId:
          type: integer
          example: 3
        subscriptionType:
          $ref: '#/components/schemas/SubscriptionType'
        status:
          type: string
          enum: [active, paused, cancelled, expired]
          example: "active"
        startDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59.000Z"
        autoRenew:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - memberId
        - subscriptionTypeId
        - status
        - startDate
        - endDate

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        amount:
          type: number
          example: 49.99
        status:
          type: string
          enum: [pending, completed, failed]
          example: "completed"
        paymentMethod:
          type: string
          example: "credit_card"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        description:
          type: string
          example: "Monthly subscription payment"
      required:
        - id
        - amount
        - status
        - paymentMethod
        - createdAt

    LoginRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: "Email de l'utilisateur (email OU phoneNumber requis)"
        phoneNumber:
          type: string
          example: "+33612345678"
          description: "Numéro de téléphone de l'utilisateur (email OU phoneNumber requis)"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        onboarding:
          type: boolean
          description: "Indique si le membre doit compléter l'onboarding (true pour les nouveaux membres uniquement)"
          example: true
        user:
          $ref: '#/components/schemas/User'

    GymRef:
      type: object
      properties:
        id:
          type: integer
          example: 1
        displayId:
          type: string
          example: "GYM-a1b2c3"
        name:
          type: string
          example: "Salle A"

    CoachRef:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 7
        firstName:
          type: string
          example: "Yassine"
        lastName:
          type: string
          example: "Benali"

    Coach:
      type: object
      properties:
        id:
          type: integer
          example: 7
        displayId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        role:
          type: string
          example: coach
        gymId:
          type: integer
          description: "Salle principale (ne pas s'en servir : utiliser gyms)"
        gyms:
          type: array
          items:
            $ref: '#/components/schemas/GymRef'
        membersCount:
          type: integer
          description: "GET /coaches uniquement : nombre de membres affectés"

    CoachedMember:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        gymId:
          type: integer
        gym:
          $ref: '#/components/schemas/GymRef'
        fitnessLevel:
          type: string
          nullable: true
        coachId:
          type: integer
          nullable: true
        coach:
          $ref: '#/components/schemas/CoachRef'
        activeSubscription:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            status:
              type: string
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
              nullable: true
            sessionQuota:
              type: integer
              nullable: true
            sessionsUsed:
              type: integer

    ProgramExercise:
      type: object
      properties:
        id:
          type: integer
          description: "Id de la ligne (programExerciseId), utilisé dans PUT/DELETE"
        exerciseId:
          type: integer
        exercise:
          $ref: '#/components/schemas/Exercise'
        sets:
          type: integer
          nullable: true
        reps:
          type: integer
          nullable: true
        duration:
          type: integer
          nullable: true
        weight:
          type: number
          nullable: true
        restTime:
          type: integer
          nullable: true
          description: Secondes
        notes:
          type: string
          nullable: true
        order:
          type: integer

    ProgramExerciseInput:
      type: object
      required: [exerciseId]
      properties:
        exerciseId:
          type: integer
        sets:
          type: integer
        reps:
          type: integer
        duration:
          type: integer
        weight:
          type: number
        restTime:
          type: integer
        notes:
          type: string
        order:
          type: integer

    ProgramDayInput:
      type: object
      required: [dayOfWeek]
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche … 6 = samedi"
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ProgramExerciseInput'

    Program:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        durationWeeks:
          type: integer
          nullable: true
        createdBy:
          $ref: '#/components/schemas/CoachRef'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        days:
          type: array
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
              exercises:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramExercise'
        assignmentsCount:
          type: integer
          description: Affectations actives

    ProgramInput:
      type: object
      properties:
        title:
          type: string
          description: Requis à la création
        description:
          type: string
        level:
          type: string
        durationWeeks:
          type: integer
        days:
          type: array
          description: "Création : jours initiaux. PUT : remplace tous les jours si fourni."
          items:
            $ref: '#/components/schemas/ProgramDayInput'

    ProgramAssignment:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
        programId:
          type: integer
        memberId:
          type: integer
        assignedBy:
          $ref: '#/components/schemas/CoachRef'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
          description: "null = sans fin (tant que l'affectation est active)"
        status:
          type: string
          enum: [active, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        program:
          $ref: '#/components/schemas/Program'

    ProgramError:
      type: object
      properties:
        error:
          type: string
          description: "title_required, invalid_day_of_week, duplicate_day, exercise_id_required, invalid_field, invalid_days, exercise_not_found, program_not_found, program_exercise_not_found, program_in_use, member_ids_required, invalid_date, assignment_rejected, assignment_not_found, member_not_found, invalid_status"
        message:
          type: string
        activeAssignments:
          type: integer
          description: "program_in_use uniquement"
        rejected:
          type: array
          description: "assignment_rejected uniquement"
          items:
            type: object
            properties:
              memberId:
                type: integer
              reason:
                type: string
                enum: [member_not_found, other_gym, not_your_member, forbidden]

    SessionMember:
      type: object
      properties:
        memberId:
          type: integer
        member:
          type: object
          properties:
            id:
              type: integer
            displayId:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            phoneNumber:
              type: string
              nullable: true
        status:
          type: string
          enum: [booked, checked_in, absent, cancelled]
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        bookedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
        gymId:
          type: integer
        gym:
          $ref: '#/components/schemas/GymRef'
        coachId:
          type: integer
        coach:
          $ref: '#/components/schemas/CoachRef'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        capacity:
          type: integer
        title:
          type: string
          nullable: true
        type:
          type: string
          enum: [discovery, training, group_class, assessment, private]
          description: "discovery = découverte, training = entraînement, group_class = cours collectif, assessment = bilan, private = coaching individuel"
        notes:
          type: string
          nullable: true
        seriesId:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, done, cancelled]
          description: "`done` posé automatiquement après la fin (inscrits non pointés → `absent`)"
        members:
          type: array
          items:
            $ref: '#/components/schemas/SessionMember'
        bookedCount:
          type: integer
          description: "Inscrits non annulés"
        remaining:
          type: integer
        createdBy:
          $ref: '#/components/schemas/CoachRef'
        createdAt:
          type: string
          format: date-time
        isMemberCoach:
          type: boolean
          description: "GET /sessions/available avec memberId uniquement"

    SessionError:
      type: object
      properties:
        error:
          type: string
          description: "missing_fields, invalid_type, invalid_date, invalid_time_range, invalid_capacity, invalid_repeat, too_many_occurrences, invalid_scope, range_too_large, coach_not_found, coach_not_in_gym, outside_opening_hours, gym_closed, session_overlap, capacity_below_booked, session_not_found, session_not_open, member_ids_required, booking_rejected, session_full, member_not_in_session, member_id_required, no_active_subscription, quota_exhausted, subscription_expired, gym_id_required, member_not_found, forbidden"
        message:
          type: string
        conflicts:
          type: array
          description: "session_overlap uniquement"
          items:
            $ref: '#/components/schemas/Session'
        rejected:
          type: array
          description: "booking_rejected uniquement"
          items:
            type: object
            properties:
              memberId:
                type: integer
              reason:
                type: string
                enum: [member_not_found, member_other_gym, no_active_subscription, member_overlap, already_booked]
        remaining:
          type: integer
          description: "session_full uniquement"

    IncidentAuthor:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [owner, manager, coach]

    IncidentMessage:
      type: object
      properties:
        id:
          type: integer
        incidentId:
          type: integer
        authorId:
          type: integer
        author:
          $ref: '#/components/schemas/IncidentAuthor'
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    Incident:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
        gymId:
          type: integer
        gym:
          $ref: '#/components/schemas/GymRef'
        createdBy:
          $ref: '#/components/schemas/IncidentAuthor'
        creatorRole:
          type: string
          enum: [manager, coach]
        source:
          type: string
          enum: [app, kiosk]
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [equipment, safety, hygiene, member, other]
        severity:
          type: string
          enum: [low, medium, high, critical]
        hasPhoto:
          type: boolean
          description: "Photo servie par GET /incidents/{id}/photo"
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: "Posé au passage en resolved ou closed"
        closedBy:
          $ref: '#/components/schemas/CoachRef'
        messagesCount:
          type: integer
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/IncidentMessage'
          nullable: true
          description: "Dernier message du chat (null si aucun)"
        unreadCount:
          type: integer
          description: "Messages des autres postérieurs au dernier lu par l'appelant (voir POST /incidents/{id}/read)"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          description: "GET /incidents/{id} uniquement, du plus ancien au plus récent"
          items:
            $ref: '#/components/schemas/IncidentMessage'

    IncidentError:
      type: object
      properties:
        error:
          type: string
          description: "missing_fields, invalid_field, invalid_photo, gym_id_required, kiosk_forbidden_role, incident_not_found, photo_not_found, incident_closed, invalid_id, invalid_cursor, forbidden"
        message:
          type: string

    CoachError:
      type: object
      properties:
        error:
          type: string
          description: "Code stable : missing_fields, gym_ids_required, invalid_gym_ids, gym_not_found, email_taken, phone_taken, coach_not_found, member_not_found, coach_not_in_gym"
        message:
          type: string

    CreatedManager:
      type: object
      properties:
        id:
          type: integer
          example: 2
        email:
          type: string
          format: email
          example: "manager@example.com"
        firstName:
          type: string
          example: "Jane"
        lastName:
          type: string
          example: "Manager"
        role:
          type: string
          example: manager
        gymId:
          type: integer
          example: 1

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Message d'erreur"

    Exercise:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Push-ups"
        description:
          type: string
          example: "Classic bodyweight exercise for chest and triceps"
        category:
          type: string
