  /subscription-types/{id}/subscriptions:
    get:
      summary: Get subscriptions by type (Admin/Owner)
      description: Get all subscriptions of a specific type. Admins see subscriptions in their gym, owners see all.
      tags: [Subscription Types]
      security:
