                description:
                  type: string
                  description: New description
                  example: "Formule premium améliorée"
                monthlyPrice:
                  type: number
                  format: float
                  description: New monthly price in euros
                  example: 89.99
                features:
                  type: array
                  items:
                    type: string
                  description: Updated list of features
                  example: ["Tout Premium +", "Coach dédié", "Spa illimité"]
                isActive:
                  type: boolean
                  description: Whether the subscription type is active
                  example: true
      responses:
        '200':
          description: Subscription type updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Type d'abonnement mis à jour avec succès"
                  type:
                    $ref: '#/components/schemas/SubscriptionType'
        '403':
          description: Access denied - not an owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subscription type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Deactivate subscription type (Owner only)
      description: Soft delete (deactivate) a subscription type. Only owners can deactivate types. Cannot deactivate a type with active subscriptions.
