                    properties:
                      canManageAdmins:
                        type: boolean
                      canManageGyms:
                        type: boolean
                      canViewReports:
                        type: boolean
                      maxGymsAllowed:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/scan-qr:
    post:
      summary: Scan and validate QR code
      description: Scan a QR code and validate gym access based on user role and active subscription
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrData
              properties:
                qrData:
                  type: string
                  description: QR code data to validate
                  example: "{\"userId\":1,\"displayId\":\"MEMBER-a8f3d9e2b1c4f567\",\"fullName\":\"John Doe\",\"role\":\"member\",\"gymName\":\"Downtown Fitness\",\"accessType\":\"gym_access\",\"timestamp\":\"2024-01-01T10:00:00.000Z\"}"
      responses:
        '200':
          description: QR code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Accès autorisé"
                  user:
                    $ref: '#/components/schemas/User'
                  accessGranted:
                    type: boolean
                    example: true
        '400':
          description: Invalid QR code or access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "QR code invalide ou accès refusé"
                  reason:
                    type: string
                    enum: [invalid_qr, expired_subscription, no_active_subscription, user_not_found]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      summary: Request password reset
