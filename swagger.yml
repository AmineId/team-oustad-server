              schema:
                type: object
                properties:
                  bannerId:
                    type: integer
                  viewCount:
                    type: integer
                  clickCount:
                    type: integer
                  uniqueViewers:
                    type: integer
                  clickThroughRate:
                    type: number
                    format: float
                    description: Taux de clic (CTR)
                  lastViewed:
                    type: string
                    format: date-time
                  lastClicked:
                    type: string
                    format: date-time
                  variants:
                    type: array
                    items:
                      type: object
                      properties:
                        variantId:
                          type: integer
                        variantName:
                          type: string
                        viewCount:
                          type: integer
                        clickCount:
                          type: integer
                        ctr:
                          type: number
                          format: float
        '403':
          description: Accès interdit
        '404':
          description: Bannière non trouvée
        '500':
          description: Erreur serveur

  /banners/stats/summary:
    get:
      summary: Résumé des statistiques de toutes les bannières
      description: Vue d'ensemble des performances (Manager/Owner)
      tags:
        - Banners
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gymId
          schema:
            type: integer
          description: Filtrer par salle
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Résumé des statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBanners:
                    type: integer
                  activeBanners:
                    type: integer
                  totalViews:
                    type: integer
                  totalClicks:
                    type: integer
                  averageCTR:
                    type: number
                    format: float
                  topPerformers:
                    type: array
                    items:
                      type: object
                      properties:
                        bannerId:
                          type: integer
                        title:
                          type: string
                        ctr:
                          type: number
                        views:
                          type: integer
                        clicks:
                          type: integer
        '403':
          description: Accès interdit
        '500':
          description: Erreur serveur

  # ==================== CHECK-IN API ====================
  /check-in:
    post:
      x-roles-v2: "Rôles V2 : staff de la salle uniquement (owner, manager de `gymId`)."
      summary: Enregistrer une entrée en salle
      description: Check-in manuel par staff
      tags:
        - Check-In
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - subscriptionId
                - gymId
              properties:
                memberId:
                  type: integer
                subscriptionId:
                  type: integer
                gymId:
                  type: integer
                isManual:
                  type: boolean
                  default: true
                notes:
                  type: string
      responses:
        '201':
          description: Check-in créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '400':
          description: Erreur (quota épuisé, déjà scanné aujourd'hui)
        '500':
          description: Erreur serveur

  /check-in/{id}/checkout:
    post:
      x-roles-v2: "Rôles V2 : staff de la salle du check-in, ou le membre lui-même."
      summary: Checkout d'un membre
      description: Enregistre l'heure de sortie d'un membre de la salle
      tags:
        - Check-In
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID du check-in à clôturer
      responses:
        '200':
          description: Checkout effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '400':
          description: Déjà checked out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Already checked out"
        '404':
          description: Check-in non trouvé
        '500':
          description: Erreur serveur

  /check-in/scan:
    post:
      x-roles-v2: "Rôles V2 : staff de la salle `gymId` (app staff ou kiosk)."
      summary: Check-in via QR code
      description: Scanner le QR code du membre (1 scan par jour)
      tags:
        - Check-In
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrCode
                - gymId
              properties:
                qrCode:
                  type: string
                  example: "MEMBER-abc123"
                gymId:
                  type: integer
      responses:
        '201':
          description: Check-in réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Check-in effectué - 6 séance(s) restante(s)"
                  checkIn:
                    $ref: '#/components/schemas/CheckIn'
                  member:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      displayId:
                        type: string
                        example: "MEMBER-abc123"
                      firstName:
                        type: string
                        example: "John"
                      lastName:
                        type: string
                        example: "Doe"
                      fullName:
                        type: string
                        example: "John Doe"
                      profileImageUrl:
                        type: string
                        nullable: true
                        example: "https://example.com/profile.jpg"
                  quota:
                    type: object
                    properties:
                      sessionQuota:
                        type: integer
                        nullable: true
                        example: 12
                        description: "Total sessions (null if unlimited)"
                      sessionsUsed:
                        type: integer
                        example: 6
                        description: "Sessions used after this check-in"
                      sessionsRemaining:
                        type: integer
                        nullable: true
                        example: 6
                        description: "Remaining sessions (null if unlimited)"
                      isUnlimited:
                        type: boolean
                        example: false
                      percentageUsed:
                        type: integer
                        example: 50
                      canCheckIn:
                        type: boolean
                        example: true
        '400':
          description: QR déjà scanné aujourd'hui ou quota épuisé
        '500':
          description: Erreur serveur

  /check-in/member/{memberId}:
    get:
      x-roles-v2: "Rôles V2 : le membre, le staff de sa salle, ou son coach."
      summary: Historique des check-ins
      description: Récupère l'historique des entrées d'un membre
      tags:
        - Check-In
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Historique des check-ins
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkIns:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckIn'
        '500':
          description: Erreur serveur

  /check-in/subscription/{subscriptionId}/quota:
    get:
      x-roles-v2: "Rôles V2 : le membre titulaire, le staff de sa salle, ou son coach."
      summary: Informations de quota
      description: Récupère les séances utilisées/restantes
      tags:
        - Check-In
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subscriptionId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Informations de quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: integer
                  displayId:
                    type: string
                  sessionQuota:
                    type: integer
                    nullable: true
                  sessionsUsed:
                    type: integer
                  sessionsRemaining:
                    type: integer
                    nullable: true
                  isUnlimited:
                    type: boolean
                  percentageUsed:
                    type: integer
                  canCheckIn:
                    type: boolean
        '404':
          description: Abonnement non trouvé
        '500':
          description: Erreur serveur

  /check-in/gym/{gymId}/today:
    get:
      x-roles-v2: "Rôles V2 : owner ou manager de la salle (le coach utilise GET /check-in/today)."
      summary: Membres présents aujourd'hui
      description: Liste des membres qui ont scanné aujourd'hui
      tags:
        - Check-In
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: gymId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des présences
          content:
            application/json:
              schema:
                type: object
                properties:
                  present:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckIn'
                  count:
                    type: integer
        '500':
          description: Erreur serveur

  /check-in/stats/gym/{gymId}:
    get:
      x-roles-v2: "Rôles V2 : owner ou manager de la salle."
      summary: Statistiques de fréquentation
      description: Stats d'une salle sur une période
      tags:
        - Check-In
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: gymId
          required: true
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCheckIns:
                    type: integer
                  uniqueMembers:
                    type: integer
                  avgCheckInsPerMember:
                    type: number
                  byDayOfWeek:
                    type: object
        '500':
          description: Erreur serveur

  # ============================================
  # STORE ENDPOINTS
  # ============================================

  /store/products:
    get:
      summary: Liste des produits
      description: Récupère tous les produits disponibles
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gymId
          schema:
            type: integer
          description: Filtrer par salle
        - in: query
          name: category
          schema:
            type: string
          description: Filtrer par catégorie
        - in: query
          name: available
          schema:
            type: boolean
          description: Seulement les produits en stock
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreProduct'
        '500':
          description: Erreur serveur

    post:
      summary: Créer un produit
      description: |
        Ajouter un nouveau produit (manager de la salle du produit ou owner ; 403 si autre salle).
        Les images sont converties en base64 et stockées directement dans la base de données.
      tags:
        - Store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - stock
              properties:
                name:
                  type: string
                  example: "Protéine Whey"
                description:
                  type: string
                  example: "Saveur vanille 1kg"
                price:
                  type: number
                  format: float
                  example: 350.00
                stock:
                  type: integer
                  example: 50
                category:
                  type: string
                  example: "Nutrition"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: |
                    Images du produit (max 5, jpeg/jpg/png/webp, 5MB chacune).
                    Converties en base64 et stockées en BDD: data:image/jpeg;base64,...
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  product:
                    $ref: '#/components/schemas/StoreProduct'
        '400':
          description: Données invalides
        '403':
          description: Non autorisé
        '500':
          description: Erreur serveur

  /store/products/{id}:
    get:
      summary: Détails d'un produit
      description: Récupère les informations d'un produit spécifique
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID du produit
      responses:
        '200':
          description: Détails du produit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  product:
                    $ref: '#/components/schemas/StoreProduct'
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

    put:
      summary: Modifier un produit
      description: |
        Met à jour un produit existant (manager de la salle du produit ou owner ; 403 si autre salle).
        Les nouvelles images sont converties en base64 et ajoutées aux existantes.
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID du produit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                stock:
                  type: integer
                category:
                  type: string
                isActive:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: |
                    Nouvelles images à ajouter (max 5 total incluant existantes).
                    Converties en base64 et ajoutées en BDD.
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  product:
                    $ref: '#/components/schemas/StoreProduct'
        '403':
          description: Non autorisé
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

    delete:
      summary: Supprimer un produit
      description: |
        Supprime un produit (manager de la salle du produit ou owner ; 403 si autre salle).
        Les images stockées en base64 sont automatiquement supprimées avec le produit.
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID du produit
      responses:
        '200':
          description: Produit supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Impossible de supprimer (réservations en attente)
        '403':
          description: Non autorisé
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

  /store/reservations:
    get:
      summary: Toutes les réservations
      description: "Liste les réservations : manager = sa salle ; owner = toutes, ou `?gymId=`"
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, cancelled]
          description: Filtrer par statut
        - in: query
          name: productId
          schema:
            type: integer
          description: Filtrer par produit
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreReservation'
        '403':
          description: Non autorisé
        '500':
          description: Erreur serveur

    post:
      summary: Créer une réservation
      description: Réserver un produit
      tags:
        - Store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 2
                notes:
                  type: string
                  example: "À récupérer ce soir"
      responses:
        '201':
          description: Réservation créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Données invalides ou stock insuffisant
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

  /store/reservations/my:
    get:
      summary: Mes réservations
      description: Récupère les réservations du membre connecté
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, cancelled]
          description: Filtrer par statut
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreReservation'
        '403':
          description: Non autorisé (membres uniquement)
        '500':
          description: Erreur serveur

  /store/reservations/{id}/cancel:
    patch:
      summary: Annuler une réservation
      description: Annule une réservation en attente
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID de la réservation
      responses:
        '200':
          description: Réservation annulée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Impossible d'annuler (déjà finalisée)
        '403':
          description: Non autorisé
        '404':
          description: Réservation non trouvée
        '500':
          description: Erreur serveur

  /store/reservations/{id}/complete:
    patch:
      summary: Finaliser une réservation
      description: Marque une réservation comme retirée (manager de la salle ou owner)
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID de la réservation
      responses:
        '200':
          description: Réservation finalisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Impossible de finaliser
        '403':
          description: Non autorisé
        '404':
          description: Réservation non trouvée
        '500':
          description: Erreur serveur

  /store/stats:
    get:
      summary: Statistiques du store
      description: "Statistiques du store : manager = sa salle ; owner = `?gymId=` ou sa salle"
      tags:
        - Store
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalProducts:
                        type: integer
                      activeProducts:
                        type: integer
                      totalReservations:
                        type: integer
                      pendingReservations:
                        type: integer
                      completedReservations:
                        type: integer
                      totalRevenue:
                        type: number
                        format: float
                      topProducts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            displayId:
                              type: string
                            name:
                              type: string
                            totalSold:
                              type: integer
        '403':
          description: Non autorisé
        '500':
          description: Erreur serveur

  /whatsapp/status:
    get:
      summary: Statut de la connexion WhatsApp
      description: Retourne si le client WhatsApp est connecté et le numéro expéditeur actif. Réservé aux propriétaires.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statut de connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    example: true
                  phone:
                    type: string
                    nullable: true
                    example: "212600123456"
                  displayName:
                    type: string
                    nullable: true
                    description: Nom d'affichage personnalisé, null si non défini
                    example: "Team Fitness"
        '403':
          description: Accès réservé aux propriétaires

  /whatsapp/qr:
    get:
      summary: QR code de connexion WhatsApp
      description: Retourne le QR code à scanner pour connecter un numéro WhatsApp. Disponible uniquement si le client n'est pas encore connecté. Réservé aux propriétaires.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR code en base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr:
                    type: string
                    description: Image PNG encodée en base64 (data URL)
                    example: "data:image/png;base64,iVBORw0KGgo..."
        '204':
          description: WhatsApp déjà connecté, pas de QR disponible
        '503':
          description: QR pas encore généré, réessayez dans quelques secondes
        '403':
          description: Accès réservé aux propriétaires

  /whatsapp/pairing-code:
    post:
      summary: Obtenir un code de couplage WhatsApp
      description: |
        Génère un code à 8 caractères pour coupler WhatsApp sans scanner de QR.
        L'owner ouvre WhatsApp → Appareils couplés → Coupler un appareil → Coupler avec un numéro, puis entre ce code.
        Réservé aux propriétaires. Impossible si WhatsApp est déjà connecté.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  description: Numéro WhatsApp de l'expéditeur (format international, sans +)
                  example: "212600123456"
      responses:
        '200':
          description: Code de couplage généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Code à 8 caractères à entrer dans WhatsApp
                    example: "ABC1-2DEF"
        '400':
          description: phoneNumber manquant
        '409':
          description: WhatsApp déjà connecté
        '403':
          description: Accès réservé aux propriétaires
        '500':
          description: Erreur génération du code

  /whatsapp/session:
    delete:
      summary: Déconnecter WhatsApp
      description: Déconnecte le client WhatsApp, supprime la session et réinitialise le client. Un nouveau QR ou code de couplage sera généré automatiquement. Réservé aux propriétaires.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session supprimée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Session WhatsApp supprimée"
        '403':
          description: Accès réservé aux propriétaires
        '500':
          description: Erreur lors de la déconnexion

  /whatsapp/display-name:
    put:
      summary: Définir le nom d'affichage WhatsApp
      description: |
        Change le nom affiché aux destinataires (pushName). Persisté et réappliqué automatiquement à chaque reconnexion.
        Passer `null` ou chaîne vide pour revenir au nom du compte. Réservé aux propriétaires.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  nullable: true
                  example: "Team Fitness"
      responses:
        '200':
          description: Nom mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName:
                    type: string
                    nullable: true
                    example: "Team Fitness"
                  applied:
                    type: boolean
                    description: true si appliqué immédiatement, false si sera appliqué à la prochaine connexion
                    example: true
        '403':
          description: Accès réservé aux propriétaires
        '500':
          description: Erreur lors du changement de nom

  /whatsapp/profile-picture:
    put:
      summary: Définir la photo de profil WhatsApp
      description: |
        Change la photo de profil du compte WhatsApp connecté.
        L'image doit être envoyée en base64 (sans le préfixe `data:image/...`).
        WhatsApp doit être connecté. Réservé aux propriétaires.
      tags: [WhatsApp]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Image encodée en base64
                  example: "/9j/4AAQSkZJRgABAQEASABIAAD..."
                mimeType:
                  type: string
                  description: Type MIME (défaut image/jpeg)
                  enum: [image/jpeg, image/png, image/webp]
                  example: "image/jpeg"
      responses:
        '200':
          description: Photo de profil mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Image manquante ou WhatsApp non connecté
        '403':
          description: Accès réservé aux propriétaires
        '500':
          description: Erreur lors du changement de photo

