          example: 1
      responses:
        '200':
          description: List of members in the gym
          content:
            application/json:
              schema:
                type: object
                properties:
                  gym:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "Fitness Center A"
                      address:
                        type: string
                        example: "123 Main St"
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        email:
                          type: string
                          example: "member@example.com"
                        fullName:
                          type: string
                          example: "John Doe"
                        displayId:
                          type: string
                          example: "MEMBER-a8f3d9e2b1c4f567"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        activeSubscription:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                              example: 1
                            type:
                              type: string
                              example: "Premium"
                            status:
                              type: string
                              enum: [active, paused, cancelled, expired, pending]
                              example: "active"
                            startDate:
                              type: string
                              format: date-time
                              example: "2024-01-01T00:00:00.000Z"
                            endDate:
                              type: string
                              format: date-time
                              example: "2024-12-31T23:59:59.000Z"
