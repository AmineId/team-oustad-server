  # ==================== BANNERS API ====================
  /banners:
    get:
      summary: Récupérer les bannières actives
      description: Récupère la liste des bannières actives avec filtrage avancé
      tags:
        - Banners
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [seasonal, event, promotion, info, announcement]
          description: Filtrer par type de bannière
        - in: query
          name: gymId
          schema:
            type: integer
          description: Filtrer par ID de salle (optionnel)
        - in: query
          name: subscriptionTypeId
          schema:
            type: integer
          description: Filtrer par type d'abonnement
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: true
          description: Afficher uniquement les bannières actives
        - in: query
          name: locale
          schema:
            type: string
            enum: [fr, en, ar]
            default: fr
          description: Langue pour les traductions
      responses:
        '200':
          description: Liste des bannières
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners:
                    type: array
                    items:
                      $ref: '#/components/schemas/Banner'
        '500':
          description: Erreur serveur
    
    post:
      summary: Créer une nouvelle bannière
      description: Créer une nouvelle bannière avec support multimédia et A/B testing (Owner uniquement — 403 pour le manager)
      tags:
        - Banners
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - type
                - startDate
                - endDate
              properties:
                title:
                  type: string
                  example: "Offre spéciale été"
                titleEn:
                  type: string
                  example: "Summer special offer"
                titleAr:
                  type: string
                  example: "عرض صيفي خاص"
                description:
                  type: string
                  example: "Profitez de -30% sur tous les abonnements"
                descriptionEn:
                  type: string
                descriptionAr:
                  type: string
                imageUrl:
                  type: string
                  format: uri
                  example: "https://example.com/banner.jpg"
                imageBase64:
                  type: string
                  description: Image encodée en base64 (optionnel)
                videoUrl:
                  type: string
                  format: uri
                  example: "https://example.com/video.mp4"
                mediaType:
                  type: string
                  enum: [image, video, gif]
                  default: image
                type:
                  type: string
                  enum: [seasonal, event, promotion, info, announcement]
                  example: "seasonal"
                startDate:
                  type: string
                  format: date-time
                  example: "2024-06-01T00:00:00Z"
                endDate:
                  type: string
                  format: date-time
                  example: "2024-08-31T23:59:59Z"
                actionType:
                  type: string
                  enum: [navigate, externalUrl, showDetails, none]
                  default: none
                actionData:
                  type: string
                  example: "/subscriptions"
                actionParams:
                  type: object
                  example: {"screen": "SubscriptionDetails", "id": 123}
                priority:
                  type: integer
                  default: 0
                  example: 10
                isActive:
                  type: boolean
                  default: true
                gymId:
                  type: integer
                  description: ID de la salle (null = toutes les salles)
                backgroundColor:
                  type: string
                  example: "#FF5733"
                textColor:
                  type: string
                  example: "#FFFFFF"
                maxViewsPerUser:
                  type: integer
                  example: 5
                  description: Limite d'affichage par utilisateur
                isScheduled:
                  type: boolean
                  default: true
                  description: Activation/désactivation automatique selon dates
                subscriptionTypeIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
                  description: Types d'abonnement ciblés (vide = tous)
      responses:
        '201':
          description: Bannière créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
        '400':
          description: Données invalides
        '403':
          description: Accès interdit
        '500':
          description: Erreur serveur

