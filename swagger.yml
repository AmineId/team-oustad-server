        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions/payments/{paymentId}/acknowledge:
    post:
      summary: Acknowledge payment and activate subscription
      description: |
        Acknowledge a payment and automatically activate the associated subscription if it's in "pending" status.
        This is the recommended endpoint for subscription payments as it handles subscription activation automatically.
        
        **Automatic Actions:**
        - Marks payment as completed
        - Records payment date and method
        - Activates subscription if status is "pending"
        - Reactivates subscription if it was "paused" and all overdue payments are settled
      tags: [Subscriptions, Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: integer
          description: Payment ID to acknowledge
          example: 199
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                paymentMethod:
                  type: string
                  description: Payment method used
                  example: "card"
                  enum: [card, cash, bank_transfer, paypal, stripe, other]
                transactionId:
                  type: string
                  description: Transaction ID from payment provider (optional)
                  example: "TXN_12345"
      responses:
        '200':
          description: Payment acknowledged and subscription updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Paiement acquitté avec succès"
                  payment:
                    allOf:
                      - $ref: '#/components/schemas/Payment'
                      - type: object
                        properties:
                          paidAt:
                            type: string
                            format: date-time
                            description: Date when payment was acknowledged
                  subscription:
                    type: object
                    nullable: true
                    description: Updated subscription info if payment was linked to a subscription
                    properties:
                      id:
                        type: integer
                        example: 31
                      status:
                        type: string
                        example: "active"
                        description: New subscription status after acknowledgement
                      type:
                        type: string
                        example: "Découverte"
                      startDate:
                        type: string
                        format: date-time
                      endDate:
                        type: string
                        format: date-time
        '400':
          description: Invalid input or payment already acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "paymentMethod est requis"
        '403':
          description: Access denied - trying to acknowledge another member's payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Paiement non trouvé"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions/payments/{paymentId}/complete:
    post:
      summary: Mark payment as completed (simple)
      description: |
        Mark a payment as completed with payment method and transaction ID.
        This endpoint only updates the payment status without additional subscription logic.
        
        **Note:** For subscription payments, use `/acknowledge` instead as it handles subscription activation automatically.
      tags: [Subscriptions, Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: integer
          description: Payment ID
          example: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                paymentMethod:
                  type: string
                  description: Payment method used
                  example: "card"
                  enum: [card, cash, bank_transfer, paypal]
                transactionId:
                  type: string
                  description: Transaction ID from payment provider
                  example: "txn_abc123xyz"
      responses:
        '200':
          description: Payment marked as completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Paiement marqué comme complété"
                  payment:
                    $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "paymentMethod est requis"
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

