                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      email:
                        type: string
                        format: email
                        example: "user@example.com"
                      fullName:
                        type: string
                        example: "John Doe"
                      fcmToken:
                        type: string
                        example: "dXZw8fR3QkGxY9..."
