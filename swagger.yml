openapi: 3.0.0
info:
  title: Team Fitness API
  version: 1.0.0
  description: API pour la gestion des salles de sport Team Fitness
  contact:
    name: Team Fitness Support
    email: support@teamfitness.com

servers:
  - url: https://api-pprod.team-oustad.com
    description: Serveur de pré-production
  - url: http://localhost:3001
    description: Serveur de développement local
  - url: https://api.teamfitness.com
    description: Serveur de production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        phoneNumber:
          type: string
          example: "+33612345678"
          description: "Numéro de téléphone de l'utilisateur"
        fullName:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [member, admin, owner]
          example: "member"
        displayId:
          type: string
          example: "MEMBER-a8f3d9e2b1c4f567"
        gymId:
          type: integer
          example: 1
        gym:
          $ref: '#/components/schemas/Gym'
      required:
        - id
        - fullName
        - role
        - displayId
        - gymId

    Gym:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Downtown Fitness"
        address:
          type: string
          example: "123 Main St"
        phone:
          type: string
          example: "+1234567890"
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHour'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - address

    OpeningHour:
      type: object
      properties:
        id:
          type: integer
          example: 1
        gymId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche, 1 = lundi, ..., 6 = samedi"
          example: 1
        openTime:
          type: string
          format: time
          example: "09:00"
        closeTime:
          type: string
          format: time
          example: "18:00"
        isClosed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - gymId
        - dayOfWeek
        - openTime
        - closeTime
        - isClosed

    SubscriptionType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Premium"
        description:
          type: string
          example: "Formule complète avec coaching personnel"
        monthlyPrice:
          type: number
          format: float
          example: 79.99
        features:
          type: array
          items:
            type: string
          example: ["Tout Standard +", "2 séances coach/mois", "Planning personnalisé"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - monthlyPrice
        - isActive

    Subscription:
      type: object
      properties:
        id:
          type: integer
          example: 1
        memberId:
          type: integer
          example: 1
        subscriptionTypeId:
          type: integer
          example: 3
        subscriptionType:
          $ref: '#/components/schemas/SubscriptionType'
        status:
          type: string
          enum: [active, paused, cancelled, expired]
          example: "active"
        startDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59.000Z"
        autoRenew:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - memberId
        - subscriptionTypeId
        - status
        - startDate
        - endDate

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        amount:
          type: number
          example: 49.99
        status:
          type: string
          enum: [pending, completed, failed]
          example: "completed"
        paymentMethod:
          type: string
          example: "credit_card"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        description:
          type: string
          example: "Monthly subscription payment"
      required:
        - id
        - amount
        - status
        - paymentMethod
        - createdAt

    LoginRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
          description: "Email de l'utilisateur (email OU phoneNumber requis)"
        phoneNumber:
          type: string
          example: "+33612345678"
          description: "Numéro de téléphone de l'utilisateur (email OU phoneNumber requis)"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        onboarding:
          type: boolean
          description: "Indique si le membre doit compléter l'onboarding (true pour les nouveaux membres uniquement)"
          example: true
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Message d'erreur"

    Exercise:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Push-ups"
        description:
          type: string
          example: "Classic bodyweight exercise for chest and triceps"
        category:
          type: string
          enum: [strength, cardio, flexibility, balance, functional]
          example: "strength"
        muscleGroup:
          type: array
          items:
            type: string
          example: ["chest", "triceps"]
        equipment:
          type: array
          items:
            type: string
          example: ["none"]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          example: "beginner"
        instructions:
          type: string
          example: "Start in plank position, lower your body until chest nearly touches floor, then push back up."
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - category
        - difficulty

    Planning:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Upper Body Strength Training"
        description:
          type: string
          example: "Focus on building upper body strength"
        startDate:
          type: string
          format: date
          example: "2025-11-15"
        endDate:
          type: string
          format: date
          example: "2025-12-15"
        status:
          type: string
          enum: [active, completed, cancelled]
          example: "active"
        memberId:
          type: integer
          example: 1
        coachId:
          type: integer
          example: 2
        member:
          type: object
          properties:
            id:
              type: integer
            fullName:
              type: string
            email:
              type: string
        coach:
          type: object
          properties:
            id:
              type: integer
            fullName:
              type: string
            email:
              type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/PlanningDay'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - title
        - startDate
        - endDate
        - status
        - memberId
        - coachId

    PlanningDay:
      type: object
      properties:
        id:
          type: integer
          example: 1
        planningId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche, 1 = lundi, ..., 6 = samedi"
          example: 1
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PlanningExercise'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - planningId
        - dayOfWeek

    PlanningExercise:
      type: object
      properties:
        id:
          type: integer
          example: 1
        planningDayId:
          type: integer
          example: 1
        exerciseId:
          type: integer
          example: 1
        sets:
          type: integer
          example: 3
        reps:
          type: integer
          example: 12
        duration:
          type: integer
          example: 30
        weight:
          type: number
          format: float
          example: 20.5
        restTime:
          type: integer
          example: 60
        notes:
          type: string
          example: "Focus on proper form"
        order:
          type: integer
          example: 1
        exercise:
          $ref: '#/components/schemas/Exercise'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - planningDayId
        - exerciseId

    SubscriptionDetails:
      type: object
      properties:
        id:
          type: integer
          example: 1
        memberId:
          type: integer
          example: 1
        plan:
          type: string
          enum: [basic, premium, vip]
          example: "premium"
        membership:
          type: string
          example: "Gold"
        status:
          type: string
          enum: [active, cancelled, expired, paused]
          example: "active"
        startDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00.000Z"
        autoRenew:
          type: boolean
          example: true
        price:
          type: number
          format: float
          example: 29.99
        billingCycle:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        activeCheck:
          type: object
          description: "Résultat de la vérification d'activité de l'abonnement"
          properties:
            isActive:
              type: boolean
              example: true
            reason:
              type: string
              enum: [subscription_inactive, subscription_expired, no_payments, last_payment_not_completed, payment_overdue]
              example: null
            details:
              type: object
              properties:
                lastPaymentDate:
                  type: string
                  format: date-time
                  example: "2024-11-01T00:00:00.000Z"
                nextPaymentDue:
                  type: string
                  format: date-time
                  example: "2024-12-01T00:00:00.000Z"
                daysUntilDue:
                  type: integer
                  example: 15
                daysExpired:
                  type: integer
                  example: null
                daysOverdue:
                  type: integer
                  example: null
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - memberId
        - plan
        - status
        - startDate
        - price
        - billingCycle

    Banner:
      type: object
      properties:
        id:
          type: integer
          example: 1
        displayId:
          type: string
          example: "BANNER-abc123"
        title:
          type: string
          example: "Offre spéciale été"
        titleEn:
          type: string
          example: "Summer special offer"
        titleAr:
          type: string
          example: "عرض صيفي خاص"
        description:
          type: string
          example: "Profitez de -30% sur tous les abonnements"
        descriptionEn:
          type: string
        descriptionAr:
          type: string
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/banner.jpg"
        imageBase64:
          type: string
          description: Image encodée en base64
        videoUrl:
          type: string
          format: uri
          example: "https://example.com/video.mp4"
        mediaType:
          type: string
          enum: [image, video, gif]
          example: "image"
        type:
          type: string
          enum: [seasonal, event, promotion, info, announcement]
          example: "seasonal"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        actionType:
          type: string
          enum: [navigate, externalUrl, showDetails, none]
          example: "none"
        actionData:
          type: string
          example: "/subscriptions"
        actionParams:
          type: object
          example: {"screen": "SubscriptionDetails", "id": 123}
        priority:
          type: integer
          example: 10
        isActive:
          type: boolean
          example: true
        gymId:
          type: integer
          nullable: true
        backgroundColor:
          type: string
          example: "#FF5733"
        textColor:
          type: string
          example: "#FFFFFF"
        maxViewsPerUser:
          type: integer
          example: 5
          description: Limite d'affichage par utilisateur
        isScheduled:
          type: boolean
          example: true
        subscriptionTypes:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
          description: IDs des types d'abonnement ciblés
        viewCount:
          type: integer
          example: 150
        clickCount:
          type: integer
          example: 25
        variants:
          type: array
          items:
            $ref: '#/components/schemas/BannerVariant'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BannerVariant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        displayId:
          type: string
          example: "VARIANT-xyz789"
        bannerId:
          type: integer
          example: 1
        variantName:
          type: string
          example: "B"
          description: Nom de la variante (A, B, C...)
        title:
          type: string
          example: "Offre limitée"
        titleEn:
          type: string
        titleAr:
          type: string
        description:
          type: string
        descriptionEn:
          type: string
        descriptionAr:
          type: string
        imageUrl:
          type: string
        imageBase64:
          type: string
        videoUrl:
          type: string
        backgroundColor:
          type: string
          example: "#3498db"
        textColor:
          type: string
          example: "#FFFFFF"
        isActive:
          type: boolean
          example: true
        weight:
          type: integer
          example: 50
          description: Pourcentage de distribution du trafic
        viewCount:
          type: integer
          example: 75
        clickCount:
          type: integer
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CheckIn:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
          example: "CHECKIN-abc123"
        memberId:
          type: integer
        subscriptionId:
          type: integer
        gymId:
          type: integer
        checkInTime:
          type: string
          format: date-time
        checkOutTime:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Durée en minutes
          nullable: true
        isManual:
          type: boolean
        notes:
          type: string
        sessionsRemaining:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    StoreProduct:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
          example: "PROD-abc123def456"
        name:
          type: string
          example: "Protéine Whey"
        description:
          type: string
          example: "Protéine saveur vanille 1kg"
        imageUrl:
          type: string
          example: "https://api.example.com/store/products/product-123.jpg"
        price:
          type: number
          format: float
          example: 350.00
        stock:
          type: integer
          example: 50
        reservedStock:
          type: integer
          example: 5
          description: Stock réservé (réservations en attente)
        availableStock:
          type: integer
          example: 45
          description: Stock disponible (stock - reservedStock)
        isActive:
          type: boolean
          example: true
        category:
          type: string
          example: "Nutrition"
        gymId:
          type: integer
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StoreReservation:
      type: object
      properties:
        id:
          type: integer
        displayId:
          type: string
          example: "RESV-abc123def456"
        productId:
          type: integer
        memberId:
          type: integer
        quantity:
          type: integer
          example: 2
        totalPrice:
          type: number
          format: float
          example: 700.00
        status:
          type: string
          enum: [pending, completed, cancelled]
          example: "pending"
        reservedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          example: "À récupérer ce soir"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /android/upload:
    post:
      tags:
        - Android OTA Updates
      summary: Upload APK with metadata
      description: Upload a new APK file with version metadata (requires authentication)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - apk
                - version_code
                - version_name
              properties:
                apk:
                  type: string
                  format: binary
                  description: APK file to upload
                version_code:
                  type: integer
                  description: Version code (numeric, incremental)
                  example: 2
                version_name:
                  type: string
                  description: Version name (semantic versioning)
                  example: "1.0.1"
                changelog:
                  type: string
                  description: Changes in this version
                  example: "Bug fixes and performance improvements"
                min_supported_version:
                  type: integer
                  description: Minimum supported version code (for force update)
                  example: 1
                force_update:
                  type: boolean
                  description: Force users to update
                  example: false
                channel:
                  type: string
                  enum: [production, beta]
                  description: Deployment channel
                  example: production
                  default: production
      responses:
        '200':
          description: APK uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "APK uploaded successfully to production channel"
                  version:
                    type: object
                    properties:
                      version_code:
                        type: integer
                        example: 2
                      version_name:
                        type: string
                        example: "1.0.1"
                      download_url:
                        type: string
                        example: "https://app.team-oustad.com/android/app-release.apk"
                      changelog:
                        type: string
                        example: "Bug fixes and performance improvements"
                      min_supported_version:
                        type: integer
                        example: 1
                      force_update:
                        type: boolean
                        example: false
                      release_date:
                        type: string
                        format: date-time
                        example: "2025-11-15T12:30:00.000Z"
                      file_size:
                        type: integer
                        example: 25000000
                      checksum:
                        type: string
                        example: "abc123def456..."
                      channel:
                        type: string
                        example: "production"
                  checksums:
                    type: object
                    properties:
                      md5:
                        type: string
                        example: "d41d8cd98f00b204e9800998ecf8427e"
                      sha256:
                        type: string
                        example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        '400':
          description: Invalid input or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "version_code and version_name are required"
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error"
                  message:
                    type: string

  /android/check-update:
    get:
      tags:
        - Android OTA Updates
      summary: Check for available updates
      description: Check if a new version is available for the Android app
      parameters:
        - in: query
          name: current_version
          required: true
          schema:
            type: integer
          description: Current installed version code
          example: 1
        - in: query
          name: channel
          schema:
            type: string
            enum: [production, beta]
          description: Update channel to check
          example: production
          default: production
        - in: query
          name: device_id
          schema:
            type: string
          description: Device identifier (optional, for analytics)
          example: "device-123"
      responses:
        '200':
          description: Update availability information
          content:
            application/json:
              schema:
                type: object
                properties:
                  update_available:
                    type: boolean
                    example: true
                  current_version:
                    type: integer
                    example: 1
                  latest_version:
                    type: object
                    nullable: true
                    properties:
                      version_code:
                        type: integer
                        example: 2
                      version_name:
                        type: string
                        example: "1.0.1"
                      download_url:
                        type: string
                        example: "https://app.team-oustad.com/android/app-release.apk"
                      changelog:
                        type: string
                        example: "Bug fixes and improvements"
                      force_update:
                        type: boolean
                        example: false
                      file_size:
                        type: integer
                        example: 25000000
                      checksum:
                        type: string
                        example: "abc123..."
                      release_date:
                        type: string
                        format: date-time
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /android/download:
    get:
      tags:
        - Android OTA Updates
      summary: Download APK
      description: Download the latest APK file
      responses:
        '200':
          description: APK file
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: APK file not found
        '500':
          description: Server error

  /android/version:
    get:
      tags:
        - Android OTA Updates
      summary: Get version metadata
      description: Get metadata for the current published version
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
