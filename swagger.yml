                      totalPayments:
                        type: integer
                        example: 12
                      completedPayments:
                        type: integer
                        example: 3
                      pendingPayments:
                        type: integer
                        example: 9
                      overduePayments:
                        type: integer
                        example: 0
                      totalPaid:
                        type: number
                        example: 239.97
                      totalRemaining:
                        type: number
                        example: 719.91
