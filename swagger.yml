          description: Non autorisé
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

  /store/reservations:
    get:
      summary: Toutes les réservations
      description: Liste toutes les réservations (admin/owner uniquement)
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, cancelled]
          description: Filtrer par statut
        - in: query
          name: productId
          schema:
            type: integer
          description: Filtrer par produit
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreReservation'
        '403':
          description: Non autorisé
        '500':
          description: Erreur serveur

    post:
      summary: Créer une réservation
      description: Réserver un produit
      tags:
        - Store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 2
                notes:
                  type: string
                  example: "À récupérer ce soir"
      responses:
        '201':
          description: Réservation créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Données invalides ou stock insuffisant
        '404':
          description: Produit non trouvé
        '500':
          description: Erreur serveur

  /store/reservations/my:
    get:
      summary: Mes réservations
      description: Récupère les réservations du membre connecté
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, completed, cancelled]
          description: Filtrer par statut
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreReservation'
        '403':
          description: Non autorisé (membres uniquement)
        '500':
          description: Erreur serveur

  /store/reservations/{id}/cancel:
    patch:
      summary: Annuler une réservation
      description: Annule une réservation en attente
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID de la réservation
      responses:
        '200':
          description: Réservation annulée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Impossible d'annuler (déjà finalisée)
        '403':
          description: Non autorisé
        '404':
          description: Réservation non trouvée
        '500':
          description: Erreur serveur

  /store/reservations/{id}/complete:
    patch:
      summary: Finaliser une réservation
      description: Marque une réservation comme retirée (admin/owner uniquement)
      tags:
        - Store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Display ID de la réservation
      responses:
        '200':
          description: Réservation finalisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reservation:
                    $ref: '#/components/schemas/StoreReservation'
        '400':
          description: Impossible de finaliser
        '403':
          description: Non autorisé
        '404':
          description: Réservation non trouvée
        '500':
          description: Erreur serveur

  /store/stats:
    get:
      summary: Statistiques du store
      description: Récupère les statistiques globales (admin/owner uniquement)
      tags:
        - Store
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalProducts:
                        type: integer
                      activeProducts:
                        type: integer
                      totalReservations:
                        type: integer
                      pendingReservations:
                        type: integer
                      completedReservations:
                        type: integer
                      totalRevenue:
                        type: number
                        format: float
                      topProducts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            displayId:
                              type: string
                            name:
                              type: string
                            totalSold:
                              type: integer
        '403':
          description: Non autorisé
        '500':
          description: Erreur serveur
