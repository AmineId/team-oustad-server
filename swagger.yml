  /users/create-coach:
    post:
      summary: Créer un coach (Owner uniquement)
      description: |
        Rôles V2. Owner avec `canManageAdmins`. Le coach est rattaché à `gymIds` (CoachGym) ; sa salle
        principale (`gymId`) est la première de la liste. Sans `password`, un email d'activation est envoyé
        comme pour les managers.
      tags: [Users, Coaches]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, gymIds]
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
                password:
                  type: string
                  description: Optionnel
                gymIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
                sendSetupEmail:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Coach créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  coach:
                    $ref: '#/components/schemas/Coach'
                  setupEmailSent:
                    type: boolean
        '400':
          description: Champs manquants, gymIds invalides, email ou téléphone déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachError'
        '403':
          description: Pas owner (ou sans canManageAdmins)
        '404':
          description: Salle introuvable (`gym_not_found`)

  /users/{id}/gyms:
    patch:
      summary: Remplacer les salles d'un coach (Owner uniquement)
      description: |
        Remplace les rattachements CoachGym. Les membres des salles retirées qui étaient affectés à ce coach
        repassent à `coachId = null` (`unassignedMembers`). Si la salle principale est retirée, elle bascule
        sur la première salle de `gymIds`.
      tags: [Users, Coaches]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gymIds]
              properties:
                gymIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Salles mises à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  gymIds:
                    type: array
                    items:
                      type: integer
                  gyms:
                    type: array
                    items:
                      $ref: '#/components/schemas/GymRef'
                  unassignedMembers:
                    type: integer
        '400':
          description: gymIds invalide
        '403':
          description: Pas owner
        '404':
          description: Coach ou salle introuvable

  /coaches:
    get:
      summary: Lister les coachs (Owner / Manager)
      description: "Owner : tous les coachs, ou ceux d'une salle avec `gymId`. Manager : coachs de sa salle (403 si `gymId` d'une autre salle)."
      tags: [Coaches]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gymId
          schema:
            type: integer
      responses:
        '200':
          description: Tableau brut de coachs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coach'
        '403':
          description: Autre rôle, ou manager sur une autre salle

  /coaches/me/members:
    get:
      summary: Membres affectés au coach connecté (Coach)
      tags: [Coaches]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tableau brut de membres (toutes les salles du coach)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachedMember'
        '403':
          description: Pas coach

  /members/{id}/coach:
    patch:
      summary: Affecter ou retirer le coach principal d'un membre (Owner / Manager)
      description: "`id` = userId du membre. Manager : membres de sa salle uniquement. Le coach doit être rattaché à la salle du membre."
      tags: [Members, Coaches]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coachId]
              properties:
                coachId:
                  type: integer
                  nullable: true
                  description: "null pour retirer le coach"
      responses:
        '200':
          description: Affectation enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId:
                    type: integer
                  coachId:
                    type: integer
                    nullable: true
                  coach:
                    $ref: '#/components/schemas/CoachRef'
        '400':
          description: "coachId invalide, ou `coach_not_in_gym`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachError'
        '403':
          description: Autre rôle, ou manager sur un membre d'une autre salle
        '404':
          description: Membre ou coach introuvable

  /programs:
    get:
      summary: Lister les programmes (Owner / Manager / Coach)
      description: Programmes communs à toutes les salles, du plus récent au plus ancien.
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filtre sur le titre (insensible à la casse)
      responses:
        '200':
          description: Tableau brut de programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
        '403':
          description: Membre
    post:
      summary: Créer un programme (Owner)
      tags: [Programs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: Programme créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          description: Body invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramError'
        '403':
          description: Pas owner
        '404':
          description: Exercice introuvable

  /programs/{id}:
    get:
      summary: Détail d'un programme (Owner / Manager / Coach)
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Programme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '404':
          description: Programme introuvable
    put:
      summary: Modifier un programme (Owner)
      description: "Les champs absents sont conservés ; `days` fourni remplace tous les jours."
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '200':
          description: Programme mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          description: Body invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramError'
        '404':
          description: Programme introuvable
    delete:
      summary: Supprimer un programme (Owner)
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Supprimé : `{ deletedId }`"
        '409':
          description: "`program_in_use` : encore des affectations actives (`activeAssignments`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramError'

  /programs/{id}/days/{dayOfWeek}/exercises:
    post:
      summary: Ajouter un exercice à un jour du programme (Owner)
      description: "Crée le jour s'il n'existe pas. `order` par défaut : à la fin du jour."
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: dayOfWeek
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramExerciseInput'
      responses:
        '201':
          description: Exercice ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramExercise'
        '400':
          description: Body invalide
        '404':
          description: Programme ou exercice introuvable

  /programs/{id}/days/{dayOfWeek}/exercises/{exerciseId}:
    put:
      summary: Modifier un exercice du programme (Owner)
      description: "`exerciseId` = id de la ligne ProgramExercise. Les champs absents sont conservés."
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: dayOfWeek
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - in: path
          name: exerciseId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramExerciseInput'
      responses:
        '200':
          description: Exercice mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramExercise'
        '404':
          description: Exercice absent de ce jour du programme
    delete:
      summary: Retirer un exercice du programme (Owner)
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: dayOfWeek
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - in: path
          name: exerciseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Retiré : `{ deletedId }`"
        '404':
          description: Exercice absent de ce jour du programme

  /programs/{id}/assignments:
    post:
      summary: Affecter un programme à des membres (Owner / Coach)
      description: |
        Tout ou rien. Owner : tous les membres ; coach : ses membres affectés. Manager : 403 forbidden.
        Un membre n'a qu'une affectation active : les précédentes passent en `completed` (`replaced`).
        Chaque membre reçoit un FCM `data: { type: "program", assignmentId, programId }`.
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds, startDate]
              properties:
                memberIds:
                  type: array
                  items:
                    type: integer
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Affectations créées
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgramAssignment'
                  replaced:
                    type: integer
        '400':
          description: memberIds ou dates invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramError'
        '403':
          description: Membre
        '404':
          description: Programme introuvable
        '422':
          description: "`assignment_rejected` avec `rejected[]` — rien n'est créé"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramError'

  /program-assignments/{id}:
    delete:
      summary: Annuler une affectation (Owner / Coach)
      description: "Passe le statut à `cancelled` (historique conservé). Mêmes droits que l'affectation."
      tags: [Programs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Affectation annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramAssignment'
        '403':
          description: Hors portée
        '404':
          description: Affectation introuvable

  /members/{id}/programs:
    get:
      summary: Programmes affectés à un membre
      description: "`id` = userId du membre. Lecture : le membre, le manager de sa salle, son coach, l'owner. Plus récent d'abord."
      tags: [Programs, Members]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed, cancelled]
      responses:
        '200':
          description: Tableau brut d'affectations (avec `program`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramAssignment'
        '403':
          description: Hors portée
        '404':
          description: Membre introuvable

  /sessions:
    get:
      summary: Lister les séances (Owner / Manager)
      description: "Owner : toutes ; manager : sa salle (403 si gymId d'une autre salle). Triées par startAt."
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [discovery, training, group_class, assessment, private]
          description: "Filtre par type de séance (400 invalid_type si inconnu)"
        - in: query
          name: gymId
          schema:
            type: integer
        - in: query
          name: coachId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, done, cancelled]
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: "Défaut : aujourd'hui 00:00"
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: "Défaut : from + 7 jours ; plage ≤ 62 jours"
      responses:
        '200':
          description: Tableau brut
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          description: Plage invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'
    post:
      summary: Créer une séance ou une série hebdomadaire (Owner / Manager de la salle)
      description: |
        Le coach doit être rattaché à la salle. Refus si une séance non annulée du coach chevauche (toutes salles).
        Avec `repeat`, une occurrence par semaine (même heure locale) jusqu'à `until` inclus, 26 au plus, en tout ou rien.
        Si des horaires d'ouverture sont définis pour le jour, la séance doit y tenir (heure du Maroc).
        Le coach reçoit un FCM `data: { type: "session", sessionId, action: "assigned" }`.
      tags: [Sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gymId, coachId, type, startAt, endAt]
              properties:
                gymId:
                  type: integer
                coachId:
                  type: integer
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 1
                  default: 1
                title:
                  type: string
                type:
                  type: string
                  enum: [discovery, training, group_class, assessment, private]
                notes:
                  type: string
                repeat:
                  type: object
                  properties:
                    weekly:
                      type: boolean
                      enum: [true]
                    until:
                      type: string
                      format: date-time
      responses:
        '201':
          description: Séance(s) créée(s) — toujours un tableau
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '400':
          description: Validation, coach_not_in_gym, outside_opening_hours, gym_closed, too_many_occurrences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'
        '403':
          description: Salle hors portée
        '409':
          description: "session_overlap avec `conflicts`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'

  /sessions/available:
    get:
      summary: Rechercher des créneaux disponibles (Owner / Manager)
      description: |
        Séances `scheduled` à venir avec des places. Avec `memberId` : exclut celles où il est inscrit ou qui
        chevauchent ses séances, et met d'abord celles de son coach (`isMemberCoach`), puis tri par date.
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [discovery, training, group_class, assessment, private]
          description: "Filtre par type de séance (400 invalid_type si inconnu)"
        - in: query
          name: gymId
          schema:
            type: integer
          description: "Obligatoire pour l'owner, forcé pour le manager"
        - in: query
          name: memberId
          schema:
            type: integer
        - in: query
          name: coachId
          schema:
            type: integer
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: "Défaut : aujourd'hui 00:00"
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: "Défaut : from + 7 jours ; plage ≤ 62 jours"
      responses:
        '200':
          description: Tableau brut
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          description: gym_id_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'

  /sessions/{id}:
    get:
      summary: Détail d'une séance (Owner / Manager de la salle / Coach de la séance)
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Séance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          description: Hors portée
        '404':
          description: Introuvable
    patch:
      summary: Modifier une séance ou sa série (Owner / Manager)
      description: "Avec scope ≠ this, le décalage de startAt/endAt s'applique à chaque occurrence. Coach et membres notifiés."
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: scope
          schema:
            type: string
            enum: [this, following, series]
            default: this
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                coachId:
                  type: integer
                capacity:
                  type: integer
                title:
                  type: string
                type:
                  type: string
                  enum: [discovery, training, group_class, assessment, private]
                notes:
                  type: string
      responses:
        '200':
          description: Séances modifiées
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '400':
          description: Validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'
        '409':
          description: session_overlap, capacity_below_booked, session_not_open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionError'
    delete:
      summary: Annuler une séance ou sa série (Owner / Manager)
      description: "Statut `cancelled` (historique conservé). Coach et membres inscrits notifiés."
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: scope
          schema:
            type: string
            enum: [this, following, series]
            default: this
      responses:
        '200':
          description: Séances annulées
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'

  /sessions/{id}/members:
    post:
      summary: Inscrire des membres (Owner / Manager)
      description: "Tout ou rien. Membres de la salle avec un abonnement actif, sans séance qui chevauche."
      tags: [Sessions]
      security:
        - bearerAuth: []
      parameters:
        - in: path
