      description: Get a list of all members in a specific gym with their subscription status and recent payments. Owners can access any gym, managers only their own gym. Chaque membre expose `coachId` (int|null) et `coach` ({id, firstName, lastName}|null) — Rôles V2.
      tags: [Users, Gyms]
      security:
        - bearerAuth: []
      parameters:
