          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

  /check-in/today:
    get:
      summary: Check-ins du jour (Coach / Manager / Owner)
      description: |
        Coach : ses salles (toutes si `gymId` absent, 403 hors de ses salles) ; manager : sa salle ; owner : `gymId` ou toutes.
        Entrées du jour (présents et sortis), plus récentes d'abord.
      tags: [Check-In]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gymId
          schema:
            type: integer
      responses:
        '200':
          description: Tableau brut
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    displayId:
                      type: string
                    memberId:
                      type: integer
                    member:
                      type: object
                      properties:
                        id:
                          type: integer
                        displayId:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                    gymId:
                      type: integer
                    gym:
                      $ref: '#/components/schemas/GymRef'
                    checkInTime:
                      type: string
                      format: date-time
                    checkOutTime:
                      type: string
                      format: date-time
                      nullable: true
                    isManual:
                      type: boolean
                    coachId:
                      type: integer
                      nullable: true
                    isMyMember:
                      type: boolean
                      description: "Membre suivi par le demandeur (coach)"
                    nextSessionToday:
                      type: object
                      nullable: true
                      description: "Prochaine séance du jour (non terminée) où le membre est inscrit"
                      properties:
                        id:
                          type: integer
                        startAt:
                          type: string
                          format: date-time
                        endAt:
                          type: string
                          format: date-time
                        coachId:
                          type: integer
                        title:
                          type: string
                          nullable: true
        '403':
          description: Membre, ou salle hors portée

  /incidents:
    post:
      summary: Signaler un incident (Manager / Coach)
      description: |
        Manager : sa salle, depuis l'app ou le kiosk. Coach : une de ses salles, depuis l'app uniquement
        (403 `kiosk_forbidden_role` avec un token kiosk). `source` est déduite du token (le body est ignoré).
        Photo optionnelle : multipart `photo` (JPEG/PNG/WebP, 5 Mo) ou JSON `photoData` (data URI base64).
        Tous les owners reçoivent un FCM `action: "created"`.
      tags: [Incidents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, category, severity]
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                category:
                  type: string
                  enum: [equipment, safety, hygiene, member, other]
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                gymId:
                  type: integer
                  description: "Obligatoire pour le coach (une de ses salles) ; forcé pour le manager"
                photo:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required: [title, description, category, severity]
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                category:
                  type: string
                  enum: [equipment, safety, hygiene, member, other]
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                gymId:
                  type: integer
                  description: "Obligatoire pour le coach (une de ses salles) ; forcé pour le manager"
                photoData:
                  type: string
                  example: "data:image/jpeg;base64,/9j/4AAQ..."
      responses:
        '201':
          description: Incident créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          description: Validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentError'
        '403':
          description: Owner, membre, salle hors portée, ou coach depuis le kiosk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentError'
    get:
      summary: Lister les incidents
      description: "Owner : tout (`gymId` optionnel) ; manager : sa salle ; coach : les siens. Plus récents d'abord."
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: gymId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
      responses:
        '200':
          description: Tableau brut (sans `messages`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
        '403':
          description: Membre, ou manager sur une autre salle

  /incidents/{id}:
    get:
      summary: Détail d'un incident avec son fil
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Incident avec `messages`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '403':
          description: Hors portée
        '404':
          description: Introuvable
    patch:
      summary: Changer le statut (Owner)
      description: "Le créateur reçoit un FCM `action: \"status\"`. `resolved` / `closed` posent `closedAt` et `closedBy`."
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, closed]
      responses:
        '200':
          description: Incident mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          description: Statut invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentError'
        '403':
          description: Pas owner

  /incidents/{id}/messages:
    get:
      summary: Messages du chat, paginés par curseur (lecteurs de l'incident)
      description: |
        Réponse `{ messages, hasMore }`, messages toujours en ordre chronologique (id croissant).
        - `after=<messageId>` (exclusif) : messages suivants, pour le polling ; `hasMore` = d'autres plus récents.
        - `before=<messageId>` (exclusif) : messages précédents ; `hasMore` = d'autres plus anciens.
        - sans curseur : les `limit` plus récents ; `hasMore` = d'autres plus anciens.
        `after` et `before` sont exclusifs entre eux (400 `invalid_cursor`). Ne marque pas comme lu.
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: after
          schema:
            type: integer
        - in: query
          name: before
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Page de messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidentMessage'
                  hasMore:
                    type: boolean
        '400':
          description: invalid_cursor
        '403':
          description: Hors portée
    post:
      summary: Écrire dans le chat (Owner / créateur)
      description: |
        Message de l'owner : le créateur est notifié ; message du créateur : les owners sont notifiés
        (FCM `data: { type: "incident", incidentId, action: "message", messageId }`).
        Écrire marque tout le fil comme lu pour l'auteur. 409 `incident_closed` une fois clôturé.
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Message ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentMessage'
        '403':
          description: Ni owner, ni créateur
        '409':
          description: incident_closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentError'

  /incidents/{id}/read:
    post:
      summary: Marquer le chat comme lu (lecteurs de l'incident)
      description: |
        Avance le curseur de lecture de l'appelant jusqu'à `lastMessageId` (défaut : dernier message).
        Le curseur ne recule jamais. Ouvert à tout lecteur de l'incident (owner, manager de la salle, créateur).
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lastMessageId:
                  type: integer
      responses:
        '200':
          description: État de lecture
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidentId:
                    type: integer
                  lastReadMessageId:
                    type: integer
                  unreadCount:
                    type: integer
        '400':
          description: invalid_cursor
        '403':
          description: Hors portée

  /incidents/{id}/photo:
    get:
      summary: Photo de l'incident (binaire)
      tags: [Incidents]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Pas de photo
