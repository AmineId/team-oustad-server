openapi: 3.0.0
info:
  title: Team Fitness API
  version: 1.0.0
  description: API pour la gestion des salles de sport Team Fitness
  contact:
    name: Team Fitness Support
    email: support@teamfitness.com

servers:
  - url: http://localhost:3000
    description: Serveur de développement
  - url: https://api.teamfitness.com
    description: Serveur de production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [member, admin, owner]
          example: "member"
        displayId:
          type: string
          example: "MEMBER-a8f3d9e2b1c4f567"
        gymId:
          type: integer
          example: 1
        gym:
          $ref: '#/components/schemas/Gym'
      required:
        - id
        - email
        - fullName
        - role
        - displayId
        - gymId

    Gym:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Downtown Fitness"
        address:
          type: string
          example: "123 Main St"
        phone:
          type: string
          example: "+1234567890"
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHour'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - address

    OpeningHour:
      type: object
      properties:
        id:
          type: integer
          example: 1
        gymId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche, 1 = lundi, ..., 6 = samedi"
          example: 1
        openTime:
          type: string
          format: time
          example: "09:00"
        closeTime:
          type: string
          format: time
          example: "18:00"
        isClosed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - gymId
        - dayOfWeek
        - openTime
        - closeTime
        - isClosed

    SubscriptionType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Premium"
        description:
          type: string
          example: "Formule complète avec coaching personnel"
        monthlyPrice:
          type: number
          format: float
          example: 79.99
        features:
          type: array
          items:
            type: string
          example: ["Tout Standard +", "2 séances coach/mois", "Planning personnalisé"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - monthlyPrice
        - isActive

    Subscription:
      type: object
      properties:
        id:
          type: integer
          example: 1
        memberId:
          type: integer
          example: 1
        subscriptionTypeId:
          type: integer
          example: 3
        subscriptionType:
          $ref: '#/components/schemas/SubscriptionType'
        status:
          type: string
          enum: [active, paused, cancelled, expired]
          example: "active"
        startDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59.000Z"
        autoRenew:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - memberId
        - subscriptionTypeId
        - status
        - startDate
        - endDate

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        amount:
          type: number
          example: 49.99
        status:
          type: string
          enum: [pending, completed, failed]
          example: "completed"
        paymentMethod:
          type: string
          example: "credit_card"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        description:
          type: string
          example: "Monthly subscription payment"
      required:
        - id
        - amount
        - status
        - paymentMethod
        - createdAt

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Message d'erreur"

    Exercise:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Push-ups"
        description:
          type: string
          example: "Classic bodyweight exercise for chest and triceps"
        category:
          type: string
          enum: [strength, cardio, flexibility, balance, functional]
          example: "strength"
        muscleGroup:
          type: array
          items:
            type: string
          example: ["chest", "triceps"]
        equipment:
          type: array
          items:
            type: string
          example: ["none"]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          example: "beginner"
        instructions:
          type: string
          example: "Start in plank position, lower your body until chest nearly touches floor, then push back up."
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - name
        - category
        - difficulty

    Planning:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Upper Body Strength Training"
        description:
          type: string
          example: "Focus on building upper body strength"
        startDate:
          type: string
          format: date
          example: "2025-11-15"
        endDate:
          type: string
          format: date
          example: "2025-12-15"
        status:
          type: string
          enum: [active, completed, cancelled]
          example: "active"
        memberId:
          type: integer
          example: 1
        coachId:
          type: integer
          example: 2
        member:
          type: object
          properties:
            id:
              type: integer
            fullName:
              type: string
            email:
              type: string
        coach:
          type: object
          properties:
            id:
              type: integer
            fullName:
              type: string
            email:
              type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/PlanningDay'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - title
        - startDate
        - endDate
        - status
        - memberId
        - coachId

    PlanningDay:
      type: object
      properties:
        id:
          type: integer
          example: 1
        planningId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: "0 = dimanche, 1 = lundi, ..., 6 = samedi"
          example: 1
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PlanningExercise'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - planningId
        - dayOfWeek

    PlanningExercise:
      type: object
      properties:
        id:
          type: integer
          example: 1
        planningDayId:
          type: integer
          example: 1
        exerciseId:
          type: integer
          example: 1
        sets:
          type: integer
          example: 3
        reps:
          type: integer
          example: 12
        duration:
          type: integer
          example: 30
        weight:
          type: number
          format: float
          example: 20.5
        restTime:
          type: integer
          example: 60
        notes:
          type: string
          example: "Focus on proper form"
        order:
          type: integer
          example: 1
        exercise:
          $ref: '#/components/schemas/Exercise'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - planningDayId
        - exerciseId

    SubscriptionDetails:
      type: object
      properties:
        id:
          type: integer
          example: 1
        memberId:
          type: integer
          example: 1
        plan:
          type: string
          enum: [basic, premium, vip]
          example: "premium"
        membership:
          type: string
          example: "Gold"
        status:
          type: string
          enum: [active, cancelled, expired, paused]
          example: "active"
        startDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00.000Z"
        autoRenew:
          type: boolean
          example: true
        price:
          type: number
          format: float
          example: 29.99
        billingCycle:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        activeCheck:
          type: object
          description: "Résultat de la vérification d'activité de l'abonnement"
          properties:
            isActive:
              type: boolean
              example: true
            reason:
              type: string
              enum: [subscription_inactive, subscription_expired, no_payments, last_payment_not_completed, payment_overdue]
              example: null
            details:
              type: object
              properties:
                lastPaymentDate:
                  type: string
                  format: date-time
                  example: "2024-11-01T00:00:00.000Z"
                nextPaymentDue:
                  type: string
                  format: date-time
                  example: "2024-12-01T00:00:00.000Z"
                daysUntilDue:
                  type: integer
                  example: 15
                daysExpired:
                  type: integer
                  example: null
                daysOverdue:
                  type: integer
                  example: null
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required:
        - id
        - memberId
        - plan
        - status
        - startDate
        - price
        - billingCycle
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      description: Check server and database connectivity
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  db:
                    type: string
                    example: "connected"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string

  /auth/login:
    post:
      summary: User login
      description: Authenticate user and return JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current user profile
      description: Get detailed profile information for the authenticated user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    format: email
                    example: "user@example.com"
                  fullName:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    enum: [owner, admin, member]
                    example: "member"
                  displayId:
                    type: string
                    example: "MEMBER-a8f3d9e2b1c4f567"
                  gym:
                    $ref: '#/components/schemas/Gym'
                  activeSubscription:
                    $ref: '#/components/schemas/Subscription'
                  recentPayments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  permissions:
                    type: object
                    description: Only present for owner role
                    properties:
                      canManageAdmins:
                        type: boolean
                      canManageGyms:
                        type: boolean
                      canViewReports:
                        type: boolean
                      maxGymsAllowed:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/scan-qr:
    post:
      summary: Scan and validate QR code
      description: Scan a QR code and validate gym access based on user role and active subscription
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrData
              properties:
                qrData:
                  type: string
                  description: QR code data to validate
                  example: "{\"userId\":1,\"displayId\":\"MEMBER-a8f3d9e2b1c4f567\",\"fullName\":\"John Doe\",\"role\":\"member\",\"gymName\":\"Downtown Fitness\",\"accessType\":\"gym_access\",\"timestamp\":\"2024-01-01T10:00:00.000Z\"}"
      responses:
        '200':
          description: QR code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Accès autorisé"
                  user:
                    $ref: '#/components/schemas/User'
                  accessGranted:
                    type: boolean
                    example: true
        '400':
          description: Invalid QR code or access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "QR code invalide ou accès refusé"
                  reason:
                    type: string
                    enum: [invalid_qr, expired_subscription, no_active_subscription, user_not_found]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Send a password reset code to the user's email address
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
      responses:
        '200':
          description: Reset code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Si cet email existe, un code de réinitialisation a été envoyé"
        '400':
          description: Email is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Reset user password using the reset token sent via email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "user@example.com"
                token:
                  type: string
                  description: 6-digit reset token
                  example: "123456"
                newPassword:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
                  example: "newpassword123"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe réinitialisé avec succès"
        '400':
          description: Invalid input or token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, token et nouveau mot de passe requis"
                      weak_password:
                        value: "Le mot de passe doit contenir au moins 6 caractères"
                      invalid_token:
                        value: "Token invalide ou expiré"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/send-setup-email:
    post:
      summary: Send account setup email
      description: Send an email to a new user with a token to set up their password. Only authenticated users (admin/owner) can use this endpoint.
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "newuser@example.com"
      responses:
        '200':
          description: Setup email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email d'activation envoyé"
        '400':
          description: Email is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/setup-password:
    post:
      summary: Setup initial password
      description: Set up password for a new user account using the token sent via email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "newuser@example.com"
                token:
                  type: string
                  description: 6-digit setup token
                  example: "123456"
                password:
                  type: string
                  minLength: 6
                  description: New password (minimum 6 characters)
                  example: "mypassword123"
      responses:
        '200':
          description: Password created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Mot de passe créé avec succès"
        '400':
          description: Invalid input or token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, token et mot de passe requis"
                      weak_password:
                        value: "Le mot de passe doit contenir au moins 6 caractères"
                      invalid_token:
                        value: "Token invalide ou expiré"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    post:
      summary: Create a new user
      description: Create a new user with role-based permissions. Admins can create members, owners can create admins and members. If no password is provided, a setup email will be sent automatically.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - fullName
                - role
                - gymId
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: "member@example.com"
                password:
                  type: string
                  minLength: 6
                  description: User's password (optional - if not provided, a setup email will be sent)
                  example: "password123"
                fullName:
                  type: string
                  description: User's full name
                  example: "John Doe"
                role:
                  type: string
                  enum: [admin, member]
                  description: User role (admin can create members, owner can create admins/members)
                  example: "member"
                gymId:
                  type: integer
                  description: ID of the gym the user belongs to
                  example: 1
                sendSetupEmail:
                  type: boolean
                  description: Whether to send setup email when password is not provided (default true)
                  example: true
                  default: true
                permissions:
                  type: object
                  description: Permissions for owner role (only used when creating owners)
                  properties:
                    canManageAdmins:
                      type: boolean
                      default: true
                    canManageGyms:
                      type: boolean
                      default: true
                    canViewReports:
                      type: boolean
                      default: true
                    maxGymsAllowed:
                      type: integer
                      default: 5
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Utilisateur créé avec succès. Un email d'activation a été envoyé."
                  user:
                    $ref: '#/components/schemas/User'
                  setupEmailSent:
                    type: boolean
                    description: Whether a setup email was sent
                    example: true
        '400':
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      missing_fields:
                        value: "Email, fullName, role et gymId requis"
                      email_exists:
                        value: "Cet email est déjà utilisé"
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      forbidden:
