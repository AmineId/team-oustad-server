version: '3.9'
services:
  postgres-test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: teamfitness_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d teamfitness_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata-test:/var/lib/postgresql/data
volumes:
  pgdata-test:
