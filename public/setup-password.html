<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration du compte - Team Fitness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .message.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .message.info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding-left: 20px;
        }

        .password-requirements li {
            margin: 4px 0;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏋️</div>
        <h1>Configuration du compte</h1>
        <p class="subtitle">Team Fitness</p>

        <div id="message" class="message"></div>

        <form id="setupForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label for="token">Code de configuration (6 chiffres)</label>
                <input type="text" id="token" name="token" required placeholder="123456" maxlength="6" pattern="\d{6}">
            </div>

            <div class="form-group">
                <label for="password">Nouveau mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="Minimum 6 caractères">
                <ul class="password-requirements">
                    <li>Minimum 6 caractères</li>
                    <li>Recommandé : lettres, chiffres et caractères spéciaux</li>
                </ul>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Retapez votre mot de passe">
            </div>

            <button type="submit" class="btn" id="submitBtn">Créer mon mot de passe</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Configuration en cours...</p>
        </div>
    </div>

    <script>
        // Récupérer les paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        const tokenParam = urlParams.get('token');

        // Pré-remplir les champs si fournis dans l'URL
        if (emailParam) {
            document.getElementById('email').value = emailParam;
        }
        if (tokenParam) {
            document.getElementById('token').value = tokenParam;
        }

        // Gestion du formulaire
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const form = document.getElementById('setupForm');

            // Réinitialiser les messages
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';

            // Validation
            if (password !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Les mots de passe ne correspondent pas.';
                return;
            }

            if (password.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Le mot de passe doit contenir au moins 6 caractères.';
                return;
            }

            if (!/^\d{6}$/.test(token)) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Le code doit contenir exactement 6 chiffres.';
                return;
            }

            // Désactiver le formulaire et afficher le chargement
            submitBtn.disabled = true;
            form.style.display = 'none';
            loading.classList.add('active');

            try {
                // Appel API
                const response = await fetch('/auth/setup-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        token,
                        password,
                    }),
                });

                const data = await response.json();

                loading.classList.remove('active');

                if (response.ok) {
                    // Succès
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = `
                        <div class="success-icon">✅</div>
                        <strong>Mot de passe créé avec succès !</strong>
                        <p>Vous pouvez maintenant vous connecter avec vos identifiants.</p>
                        <p style="margin-top: 15px;">
                            <a href="/login" style="color: #667eea; text-decoration: none; font-weight: 600;">→ Se connecter</a>
                        </p>
                    `;
                } else {
                    // Erreur
                    messageDiv.className = 'message error';
                    messageDiv.textContent = `❌ ${data.error || 'Une erreur est survenue.'}`;
                    form.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                loading.classList.remove('active');
                form.style.display = 'block';
                submitBtn.disabled = false;
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Erreur de connexion au serveur. Veuillez réessayer.';
            }
        });

        // Validation en temps réel du code (seulement des chiffres)
        document.getElementById('token').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
